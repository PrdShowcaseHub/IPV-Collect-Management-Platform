<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据看板 - IPV数据管理平台</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    /* === 看板工具栏 === */
    .dash-toolbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .dash-toolbar h3 { font-size:14px; font-weight:600; color:var(--text-1); display:flex; align-items:center; gap:6px; }
    .dash-toolbar h3::before { content:''; width:3px; height:14px; background:var(--primary); border-radius:2px; }
    .dash-actions { display:flex; gap:8px; }
    .btn-add-chart { font-size:12px; color:#fff; background:var(--primary); border:none; border-radius:7px; padding:7px 14px; cursor:pointer; font-family:var(--fn); display:inline-flex; align-items:center; gap:5px; transition:all .15s; height:32px; }
    .btn-add-chart:hover { background:var(--primary-dark); }
    .btn-view-toggle { width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; color:var(--text-2); background:#fff; border:1px solid var(--border); border-radius:7px; cursor:pointer; transition:all .15s; }
    .btn-view-toggle:hover, .btn-view-toggle.active { color:var(--primary); border-color:var(--primary); background:var(--primary-lighter); }
    .btn-view-toggle svg { width:22px; height:22px; display:block; flex-shrink:0; }

    /* === 看板标签页 === */
    .dash-tabsbar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px 14px; margin-bottom:16px; }
    .dash-tabs { display:flex; align-items:center; gap:2px; padding:3px; background:var(--primary-lighter); border-radius:8px; }
    .dash-tab { padding:7px 16px; font-size:13px; font-weight:600; color:var(--text-2); background:none; border:none; border-radius:6px; cursor:pointer; font-family:var(--fn); transition:all .15s; }
    .dash-tab:hover { color:var(--primary); }
    .dash-tab.active { color:var(--primary); background:#fff; box-shadow:var(--shadow-sm); }
    .dash-tab-panel { display:block; }
    .dash-tab-panel[hidden] { display:none !important; }

    /* === 固定图表网格 === */
    .fixed-grid { display:grid; grid-template-columns:1fr; gap:14px; margin-bottom:16px; }
    .fixed-grid.is-two-column { grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .fixed-grid .chart-card { min-width:0; }
    @media (max-width:900px) {
      .fixed-grid.is-two-column { grid-template-columns:1fr; }
    }
    .chart-card { background:#fff; border:1px solid var(--border); border-radius:10px; display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--shadow-sm); }
    .chart-card-head { display:flex; align-items:center; gap:8px; padding:11px 16px; border-bottom:1px solid var(--border-soft); background:var(--grad-head); }
    .chart-card-title { font-size:13px; font-weight:600; color:var(--text-1); display:flex; align-items:center; gap:7px; flex-shrink:0; }
    .chart-badge { display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:20px; padding:0 5px; border-radius:5px; font-size:10px; font-weight:700; background:var(--primary-soft); color:var(--primary); }
    .chart-badge.bc2 { background:var(--brand-soft); color:var(--brand-dark); }
    .chart-card-filters { display:flex; gap:5px; flex-wrap:wrap; margin-left:auto; }
    .chart-filter { height:26px; font-size:11px; border:1px solid var(--border); border-radius:5px; padding:0 6px 0 8px; background:#fff; color:var(--text-2); font-family:var(--fn); cursor:pointer; outline:none; }
    .chart-filter:focus { border-color:var(--primary); }

    /* === 下拉复选框（卡片筛选：年份多选） === */
    .chart-filter-multi { position:relative; display:inline-flex; }
    .chart-filter-multi .chart-filter-trigger { display:inline-flex; align-items:center; gap:5px; height:26px; max-width:230px; font-size:11px; border:1px solid var(--border); border-radius:5px; padding:0 7px 0 8px; background:#fff; color:var(--text-2); font-family:var(--fn); cursor:pointer; outline:none; transition:all .15s; }
    .chart-filter-multi .chart-filter-trigger .cf-value { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .chart-filter-multi .chart-filter-trigger:hover { border-color:var(--primary); color:var(--primary); }
    .chart-filter-multi.open .chart-filter-trigger { border-color:var(--primary); color:var(--primary); box-shadow:0 0 0 3px rgba(var(--primary-rgb), .1); }
    .chart-filter-multi .cf-caret { flex-shrink:0; width:0; height:0; margin-left:2px; border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid var(--text-placeholder); transition:transform .15s; }
    .chart-filter-multi.open .chart-filter-trigger .cf-caret { transform:rotate(180deg); border-top-color:var(--primary); }
    .chart-filter-pop { position:absolute; top:calc(100% + 5px); right:0; z-index:60; display:none; min-width:190px; background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow-md); padding:6px; }
    .chart-filter-multi.open .chart-filter-pop { display:block; }
    .chart-filter-pop-head { display:flex; align-items:center; justify-content:space-between; padding:3px 5px 7px; border-bottom:1px solid var(--border-soft); margin-bottom:3px; }
    .chart-filter-pop-head .cf-pop-title { font-size:11px; font-weight:600; color:var(--text-1); }
    .cf-pop-link { border:none; background:none; padding:0; font-size:10.5px; color:var(--primary); cursor:pointer; font-family:var(--fn); line-height:1.4; }
    .cf-pop-link:hover { text-decoration:underline; }
    .chart-filter-pop-body { max-height:198px; overflow-y:auto; }
    .chart-filter-opt { display:flex; align-items:center; gap:7px; padding:5px 6px; border-radius:5px; cursor:pointer; font-size:11px; color:var(--text-2); user-select:none; transition:background .1s; }
    .chart-filter-opt:hover { background:var(--primary-lighter); }
    .chart-filter-opt input[type=checkbox] { margin:0; width:13px; height:13px; accent-color:var(--primary); cursor:pointer; flex-shrink:0; }
    .chart-filter-opt.checked { color:var(--primary); font-weight:600; }
    .chart-filter-opt.disabled { opacity:.55; cursor:not-allowed; }
    .chart-filter-opt.disabled:hover { background:transparent; }
    .chart-empty-hint { display:flex; align-items:center; justify-content:center; height:268px; min-width:480px; font-size:12px; color:var(--text-3); }
    .chart-card-main { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:18px; padding:14px 20px 16px; }
    .chart-card-body { flex:0 1 auto; min-width:0; max-width:100%; display:flex; align-items:center; justify-content:center; overflow:visible; }
    .chart-card-body .combo-viz { width:auto; height:268px; max-width:100%; }
    .chart-card-foot { flex:0 0 auto; max-width:190px; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:10px; padding:2px 0 2px 18px; font-size:11px; color:var(--text-3); border-left:1px solid var(--border-soft); }
    .chart-card-foot .legend-item { white-space:nowrap; gap:6px; line-height:1; }

    /* === 自定义图表行布局：图表主体 + 右侧色块说明 === */
    .cc-chart-row { flex:1; min-width:0; width:100%; display:flex; align-items:center; justify-content:center; gap:18px; }
    .cc-chart-viz { flex:0 1 auto; min-width:0; max-width:100%; display:flex; align-items:center; justify-content:center; overflow:visible; }
    .cc-chart-foot { flex:0 0 auto; max-width:190px; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:10px; padding:2px 0 2px 18px; font-size:11px; color:var(--text-3); border-left:1px solid var(--border-soft); }
    .cc-chart-foot .legend-item { white-space:nowrap; gap:6px; line-height:1; }
    .cc-chart-row svg { max-width:100%; max-height:100%; }
    .cc-chart-viz .combo-viz, .cc-chart-viz .line-viz { width:auto; height:264px; max-width:100%; max-height:100%; }
    .cc-chart-viz .pie-viz-svg { width:auto; height:232px; max-width:100%; max-height:100%; display:block; }
    .cc-chart-foot .pie-legend-item { gap:6px; line-height:1.4; width:100%; }
    .cc-chart-foot .pie-legend-item .pie-legend-val { margin-left:auto; }
    .custom-chart-area .cc-chart-row { width:100%; height:100%; }
    .custom-chart-area .cc-chart-viz { height:100%; }
    .custom-chart-area .cc-chart-viz .pie-viz-svg { height:auto; max-height:100%; max-width:100%; }
    .custom-chart-area .cc-chart-viz .combo-viz, .custom-chart-area .cc-chart-viz .line-viz { height:100%; max-height:100%; width:auto; }
    .cc-preview-area .cc-chart-canvas { display:flex; flex-direction:column; }
    .cc-preview-area .cc-chart-canvas .cc-chart-row { flex:1 0 auto; width:100%; }

    /* === 图表公共样式 === */
    .combo-viz { width:100%; height:280px; display:block; }
    .custom-chart-area .combo-viz { height:100%; }
    .combo-viz text { font-family:var(--fn); }
    .combo-viz .grid-line { stroke:var(--border-soft); stroke-width:1; }
    .combo-viz .axis-label { font-size:10px; fill:var(--text-3); }
    .combo-viz .bar-label { font-size:9.5px; font-weight:600; fill:var(--text-2); }
    .combo-viz .line-label { font-size:9.5px; font-weight:600; }
    .combo-viz .seg-label { font-size:9.5px; font-weight:600; }
    .combo-legend { display:flex; flex-wrap:wrap; justify-content:center; gap:8px 14px; font-size:11px; color:var(--text-3); }
    .legend-item { display:flex; align-items:center; gap:4px; }
    .legend-dot { width:9px; height:9px; border-radius:2px; flex-shrink:0; }

    /* === 柱状图 CSS === */
    .bar-viz { display:flex; align-items:flex-end; gap:12px; width:100%; height:200px; padding:0 4px; }
    .bar-col-viz { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
    .bar-val { font-size:10px; font-weight:600; color:var(--text-2); font-family:var(--fn); }
    .bar-fill { width:60%; border-radius:4px 4px 0 0; background:var(--primary); transition:height .3s; min-height:3px; }
    .bar-fill.brand { background:var(--brand); }
    .bar-lbl { font-size:10px; color:var(--text-3); }

    /* === 堆积柱状图 CSS === */
    .stacked-viz { display:flex; flex-direction:column; gap:8px; width:100%; }
    .stacked-legend { display:flex; gap:12px; font-size:10px; color:var(--text-3); }
    .stacked-bars { display:flex; align-items:flex-end; gap:12px; height:180px; }
    .stacked-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
    .stacked-col-bars { width:60%; height:100%; display:flex; flex-direction:column-reverse; border-radius:4px; overflow:hidden; }
    .stacked-seg { transition:height .3s; }
    .stacked-lbl { font-size:10px; color:var(--text-3); }

    /* === 折线图 SVG === */
    .line-viz { width:100%; height:280px; display:block; }
    .line-viz .grid-line { stroke:var(--border-soft); stroke-width:1; }
    .line-viz .axis-label { font-size:10px; fill:var(--text-3); font-family:var(--fn); }
    .line-viz .line-label { font-size:8.5px; font-weight:600; }
    .line-viz .data-line { fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .line-viz .data-point { stroke-width:2; }

    /* === 饼图 SVG === */
    .pie-legend-item { display:flex; align-items:center; gap:6px; color:var(--text-2); }
    .pie-legend-val { font-weight:600; color:var(--text-1); font-family:var(--fn); }

    /* === 表格 === */
    .table-viz { width:100%; font-size:11px; }
    .table-viz th { background:var(--th-bg); color:var(--text-3); font-weight:600; padding:6px 8px; text-align:left; font-size:10px; }
    .table-viz td { padding:6px 8px; color:var(--text-2); border-bottom:1px solid var(--border-soft); }
    .table-viz tr:last-child td { border-bottom:none; }

    /* === 自定义图表区 === */
    .custom-section { margin-top:4px; }
    .custom-empty { background:#fff; border:1px dashed var(--border); border-radius:10px; padding:40px 20px; text-align:center; }
    .custom-empty-ico { width:48px; height:48px; border-radius:12px; background:var(--primary-lighter); color:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
    .custom-empty p { font-size:12px; color:var(--text-3); }
    .custom-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); gap:14px; }
    .custom-card { background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
    .custom-card-head { padding:10px 14px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border-soft); flex-shrink:0; }
    .custom-card-title { font-size:13px; font-weight:600; color:var(--text-1); display:flex; align-items:center; gap:6px; }
    .custom-card-type { font-size:10px; padding:1px 6px; border-radius:4px; background:var(--primary-soft); color:var(--primary); }
    .custom-card-actions { display:flex; gap:4px; }
    .custom-card-actions button { border:none; background:none; cursor:pointer; color:var(--text-3); padding:4px; border-radius:4px; display:flex; align-items:center; }
    .custom-card-actions button:hover { background:var(--bg-hover); color:var(--primary); }
    .custom-card-body { height:300px; background:var(--canvas); display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .custom-chart-area { background:#fff; border-radius:8px; width:calc(100% - 20px); height:calc(100% - 20px); display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:var(--shadow-sm); }
    .custom-chart-area > * { width:100%; max-height:100%; }
    .custom-chart-area svg { max-width:100%; max-height:100%; }
    .custom-chart-area .table-viz { font-size:10px; max-height:100%; overflow:auto; }
    .custom-chart-area .line-viz { width:100%; height:100%; }
    .custom-card-foot { padding:6px 14px 10px; font-size:10px; color:var(--text-3); display:flex; justify-content:space-between; flex-shrink:0; }

    /* === 全屏图表编辑器 === */
    .cc-editor { position:fixed; inset:0; z-index:6500; background:#fff; display:none; flex-direction:column; }
    .cc-editor.active { display:flex; }
    .cc-editor-top { height:48px; padding:0 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border); background:var(--grad-head); flex-shrink:0; }
    .cc-editor-back { display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px; color:var(--text-2); border:none; background:none; font-family:var(--fn); }
    .cc-editor-back:hover { color:var(--primary); }
    .cc-editor-title { font-size:14px; font-weight:700; color:var(--text-1); display:flex; align-items:center; gap:8px; }
    .cc-editor-title::before { content:''; width:3px; height:16px; background:var(--primary); border-radius:2px; }
    .cc-editor-name-input { height:30px; border:1px solid var(--border); border-radius:6px; padding:0 10px; font-size:13px; color:var(--text-1); font-family:var(--fn); background:#fff; outline:none; width:200px; }
    .cc-editor-name-input:focus { border-color:var(--primary); }
    .cc-editor-meta { font-size:11px; color:var(--text-3); display:flex; align-items:center; gap:8px; }
    .cc-editor-meta .cc-version-chip { background:var(--primary-soft); color:var(--primary); padding:2px 8px; border-radius:5px; font-size:11px; }
    .cc-editor-actions { margin-left:auto; display:flex; gap:8px; align-items:center; }
    .cc-editor-btn-save { font-size:12px; color:#fff; background:var(--primary); border:none; border-radius:7px; padding:7px 16px; cursor:pointer; font-family:var(--fn); display:inline-flex; align-items:center; gap:5px; transition:all .15s; height:32px; }
    .cc-editor-btn-save:hover { background:var(--primary-dark); }

    .cc-editor-body { flex:1; display:grid; grid-template-columns:270px 400px minmax(0,1fr); overflow:hidden; }

    /* 左面板 — 字段列表 */
    .cc-left { min-width:0; min-height:0; border-right:1px solid var(--border); overflow:hidden; display:flex; flex-direction:column; }
    .cc-left-section { padding:12px 14px; border-bottom:1px solid var(--border-soft); flex-shrink:0; }
    .cc-left-fields { flex:1 1 0; min-height:240px; overflow-y:auto; }
    .cc-left-type-section { flex:0 1 28%; min-height:0; overflow-y:auto; }
    .cc-left-title { font-size:11px; font-weight:700; color:var(--text-3); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
    .cc-field-search { width:100%; height:28px; border:1px solid var(--border); border-radius:5px; padding:0 8px; font-size:11px; color:var(--text-2); background:#fff; outline:none; margin-bottom:8px; }
    .cc-field-search:focus { border-color:var(--primary); }
    .cc-field-group-label { font-size:10px; font-weight:600; color:var(--text-3); margin:8px 0 4px; }
    .cc-field-item { padding:5px 8px; border-radius:5px; cursor:grab; display:flex; gap:7px; align-items:center; transition:background .12s; }
    .cc-field-item:hover { background:var(--primary-lighter); }
    .cc-field-item.dragging { opacity:.4; }
    .cc-field-item.in-use { opacity:.5; }
    .cc-field-item.in-use .cc-field-name::after { content:' ✓'; color:var(--primary); }
    .cc-field-tag { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:3px; font-size:9px; font-weight:700; flex-shrink:0; }
    .cc-field-tag.dim { background:var(--primary-soft); color:var(--primary); }
    .cc-field-tag.metric { background:var(--brand-soft); color:var(--brand-dark); }
    .cc-field-name { min-width:0; font-size:11.5px; color:var(--text-2); overflow-wrap:anywhere; }

    /* 图表类型选择 */
    .cc-type-grid { display:flex; flex-direction:column; gap:10px; padding:10px 14px; }
    .cc-type-group { display:flex; flex-direction:column; gap:5px; }
    .cc-type-group-title { font-size:10px; font-weight:700; color:var(--text-3); }
    .cc-type-group-options { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
    .cc-type-card { border:1.5px solid var(--border); border-radius:7px; padding:8px 2px 6px; cursor:pointer; text-align:center; transition:all .15s; background:#fff; }
    .cc-type-card:hover { border-color:var(--primary); background:var(--primary-lighter); }
    .cc-type-card.active { border-color:var(--primary); background:var(--primary-soft); }
    .cc-type-card svg { color:var(--text-3); margin-bottom:2px; }
    .cc-type-card.active svg { color:var(--primary); }
    .cc-type-card span { display:block; font-size:10px; color:var(--text-2); }
    .cc-type-card.active span { color:var(--primary); font-weight:600; }

    /* 中面板 — 字段配置 */
    .cc-middle { border-right:1px solid var(--border); overflow:hidden; display:flex; flex-direction:column; }
    .cc-middle > .cc-panel:first-child { flex:none; }
    .cc-panel { border-bottom:1px solid var(--border-soft); }
    .cc-panel-head { padding:10px 14px 6px; font-size:12px; font-weight:600; color:var(--text-1); display:flex; align-items:center; gap:6px; }
    .cc-panel-head::before { content:''; width:3px; height:13px; background:var(--primary); border-radius:2px; }
    .cc-panel-body { padding:8px 14px 14px; }

    /* 拖放槽 */
    .cc-slot-row { display:grid; grid-template-columns:64px 1fr; border:1px solid var(--border); border-radius:7px; min-height:44px; margin-bottom:8px; transition:all .15s; }
    .cc-slot-row.dragover { border-color:var(--primary) !important; background:var(--primary-soft) !important; border-style:solid !important; }
    .cc-slot-row.invalid-drop { border-color:#EF4444 !important; background:#FEF2F2 !important; }
    .cc-slot-row.empty { border-style:dashed; }
    .cc-slot-label { display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:var(--text-3); border-right:1px solid var(--border-soft); }
    .cc-slot-drop { display:flex; flex-wrap:wrap; gap:5px; padding:6px 8px; align-items:center; min-height:44px; }
    .cc-slot-empty-hint { font-size:10px; color:var(--text-placeholder); }
    .cc-field-chip { padding:3px 5px 3px 7px; background:var(--primary-lighter); border:1px solid var(--border); border-radius:5px; font-size:11.5px; cursor:pointer; display:inline-flex; align-items:center; gap:4px; transition:all .12s; }
    .cc-field-chip:hover { border-color:var(--primary); background:var(--primary-soft); }
    .cc-field-chip .cc-chip-agg { font-size:9px; color:var(--text-3); background:#fff; padding:1px 4px; border-radius:3px; }
    .cc-field-chip .cc-chip-close { cursor:pointer; color:var(--text-3); font-size:14px; line-height:1; padding:0 2px; border:none; background:none; }
    .cc-field-chip .cc-chip-close:hover { color:#EF4444; }

    /* 版本选择 */
    .cc-version-group { margin-bottom:8px; }
    .cc-version-label { font-size:11px; color:var(--text-3); margin-bottom:4px; }
    .cc-version-select { width:100%; height:30px; border:1px solid var(--border); border-radius:5px; padding:0 8px; font-size:12px; color:var(--text-1); background:#fff; cursor:pointer; outline:none; }
    .cc-version-select:focus { border-color:var(--primary); }

    /* 筛选条件 — 中栏竖排面板 */
    .cc-filter-panel { flex:1; min-height:0; display:flex; flex-direction:column; border-bottom:none; overflow:hidden; }
    .cc-filter-head { margin:2px 12px 8px; flex-shrink:0; display:flex; flex-direction:column; gap:6px; }
    .cc-filter-head-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

    /* ===== 自定义图表状态 ===== */

    /* ===== 渲染函数 ===== */
    function renderBarChart(container, labels, values, color) {
      var n = labels.length;
      var w = Math.max(500, n * 60), h = 280, pad = { t:20, r:20, b:30, l:45 };
      var cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
      var stepX = cw / n, barW = stepX * 0.5;
      var max = Math.max.apply(null, values.concat([1]));
      var barColor = color === 'brand' ? '#E68620' : '#2E5F95';
      var ticks = [0, max*0.25, max*0.5, max*0.75, max];
      var grid = ticks.map(function(v) {
        var y = pad.t + ch - (v / max) * ch;
        return '<line class="grid-line" x1="' + pad.l + '" y1="' + y + '" x2="' + (w-pad.r) + '" y2="' + y + '" stroke-dasharray="3,3" />';
      }).join('');
      var axisLines = '<line x1="' + pad.l + '" y1="' + pad.t + '" x2="' + pad.l + '" y2="' + (pad.t+ch) + '" stroke="var(--border)" stroke-width="1" />' +
        '<line x1="' + pad.l + '" y1="' + (pad.t+ch) + '" x2="' + (w-pad.r) + '" y2="' + (pad.t+ch) + '" stroke="var(--border)" stroke-width="1" />';
      var yLeft = ticks.map(function(v) {
        var y = pad.t + ch - (v / max) * ch;
        return '<text class="axis-label" x="' + (pad.l-4) + '" y="' + (y+3) + '" text-anchor="end">' + Math.round(v) + '</text>';
      }).join('');
      var bars = labels.map(function(label, i) {
        var x = pad.l + i * stepX + (stepX - barW) / 2;
        var barH = (values[i] / max) * ch;
        var y = pad.t + ch - barH;
        return '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + barH + '" fill="' + barColor + '" rx="2" />' +
               '<text class="bar-label" x="' + (x + barW/2) + '" y="' + (y - 4) + '" text-anchor="middle">' + values[i] + '</text>';
      }).join('');
      var xLabels2 = labels.map(function(l, i) {
        return '<text class="axis-label" x="' + (pad.l + i*stepX + stepX/2) + '" y="' + (h-8) + '" text-anchor="middle">' + l + '</text>';
      }).join('');
      container.innerHTML = '<svg class="combo-viz" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet">' + grid + axisLines + bars + yLeft + xLabels2 + '</svg>';
      var legendItems = '<span class="legend-item"><span class="legend-dot" style="background:' + barColor + '"></span>数值</span>';
      var foot = document.getElementById(container.id + '-foot');
      if (foot) foot.innerHTML = legendItems;
    }

    function renderGroupedBarChart(container, labels, series) {
      var n = labels.length, nSeries = series.length;
      var w = Math.max(500, n * (nSeries * 14 + 30)), h = 280, pad = { t:20, r:20, b:30, l:45 };
      var cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
      var stepX = cw / n, groupW = stepX * 0.7, barW = groupW / nSeries;
      var colors = ['#2E5F95', '#5AA0E6', '#8FC0EF', '#BFDCF6', '#E68620', '#D97706'];
      var max = Math.max.apply(null, series.flatMap(function(s) { return s.values; }).concat([1]));
      var ticks = [0, max*0.25, max*0.5, max*0.75, max];
      var legend = series.map(function(s, i) {
        return '<span class="legend-item"><span class="legend-dot" style="background:' + colors[i % colors.length] + '"></span>' + s.name + '</span>';
      }).reverse().join('');
      var grid = ticks.map(function(v) {
        var y = pad.t + ch - (v / max) * ch;
        return '<line class="grid-line" x1="' + pad.l + '" y1="' + y + '" x2="' + (w-pad.r) + '" y2="' + y + '" stroke-dasharray="3,3" />';
      }).join('');
      var axisLines = '<line x1="' + pad.l + '" y1="' + pad.t + '" x2="' + pad.l + '" y2="' + (pad.t+ch) + '" stroke="var(--border)" stroke-width="1" />' +
        '<line x1="' + pad.l + '" y1="' + (pad.t+ch) + '" x2="' + (w-pad.r) + '" y2="' + (pad.t+ch) + '" stroke="var(--border)" stroke-width="1" />';
      var yLeft = ticks.map(function(v) {
        var y = pad.t + ch - (v / max) * ch;
        return '<text class="axis-label" x="' + (pad.l-4) + '" y="' + (y+3) + '" text-anchor="end">' + Math.round(v) + '</text>';
      }).join('');
      var bars = labels.map(function(label, labelIndex) {
        var groupX = pad.l + labelIndex * stepX + (stepX - groupW) / 2;
        return series.map(function(s, seriesIndex) {
          var value = s.values[labelIndex];
          var x = groupX + seriesIndex * barW;
          var barH = (value / max) * ch;
          var y = pad.t + ch - barH;
          return '<rect x="' + x + '" y="' + y + '" width="' + (barW - 1) + '" height="' + barH + '" fill="' + colors[seriesIndex % colors.length] + '" rx="1.5" />' +
                 '<text class="bar-label" x="' + (x + barW/2) + '" y="' + (y - 4) + '" text-anchor="middle" style="font-size:8px;">' + value + '</text>';
        }).join('');
      }).join('');
      var xLabels2 = labels.map(function(l, i) {
        return '<text class="axis-label" x="' + (pad.l + i*stepX + stepX/2) + '" y="' + (h-8) + '" text-anchor="middle">' + l + '</text>';
      }).join('');
      container.innerHTML = '<svg class="combo-viz" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet">' + grid + axisLines + bars + yLeft + xLabels2 + '</svg>';
      var foot = document.getElementById(container.id + '-foot');
      if (foot) foot.innerHTML = legend;
    }

    function renderStackedChart(container, labels, series) {
      const legend = series.slice().reverse().map(s => `<span class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>${s.name}</span>`).join('');
      const bars = labels.map((label, i) => {
        const segs = series.map(s => `<div class="stacked-seg" style="height:${(s.values[i])*100}%;background:${s.color};" title="${s.name}: ${(s.values[i]*100).toFixed(0)}%"></div>`).join('');
        return `<div class="stacked-col"><div class="stacked-col-bars">${segs}</div><div class="stacked-lbl">${label}</div></div>`;
      }).join('');
      container.innerHTML = `
        <div class="stacked-viz">
          <div class="stacked-legend">${legend}</div>
          <div class="stacked-bars">${bars}</div>
        </div>
      `;
    }

    function renderLineChart(container, labels, series, showMarkers) {
      const n = labels.length;
      const w = Math.max(500, n * 60), h = 280, pad = { t:20, r:20, b:30, l:45 };
      const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
      const maxVal = Math.max(...series.flatMap(s => s.values), 1);
      const stepX = cw / (labels.length - 1 || 1);
      const colors = ['#2E5F95', '#E68620', '#10B981', '#7C3AED'];
      const gridLines = [0, 0.25, 0.5, 0.75, 1].map(p => {
        const y = pad.t + ch - p * ch;
        return `<line class="grid-line" x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" />`;
      }).join('');
      const axisLines = `<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t+ch}" stroke="var(--border)" stroke-width="1" /><line x1="${pad.l}" y1="${pad.t+ch}" x2="${w-pad.r}" y2="${pad.t+ch}" stroke="var(--border)" stroke-width="1" />`;
      const xLabels = labels.map((l, i) => `<text class="axis-label" x="${pad.l + i*stepX}" y="${h-8}" text-anchor="middle">${l}</text>`).join('');
      const yLabels = [0, maxVal/2, maxVal].map((v, i) => {
        const y = pad.t + ch - (i/2) * ch;
        return `<text class="axis-label" x="${pad.l-4}" y="${y+3}" text-anchor="end">${v.toFixed(0)}</text>`;
      }).join('');
      const lines = series.map((s, si) => {
        const c = colors[si % colors.length];
        const pts = s.values.map((v, i) => `${pad.l + i*stepX},${pad.t + ch - (v/maxVal)*ch}`).join(' ');
        const dots = s.values.map((v, i) => `<circle class="data-point" cx="${pad.l + i*stepX}" cy="${pad.t + ch - (v/maxVal)*ch}" r="3" fill="${c}" stroke="#fff" /><text class="line-label" x="${pad.l + i*stepX}" y="${pad.t + ch - (v/maxVal)*ch - 8}" text-anchor="middle" fill="${c}">${v}</text>`).join('');
        return `<polyline class="data-line" stroke="${c}" points="${pts}" />${showMarkers ? dots : ''}`;
      }).join('');
      container.innerHTML = `<svg class="line-viz" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${gridLines}${axisLines}${xLabels}${yLabels}${lines}</svg>`;
      const legend = series.map((s, si) => {
        const c = colors[si % colors.length];
        return `<span class="legend-item"><span class="legend-dot" style="background:${c}"></span>${s.name}</span>`;
      }).reverse().join('');
      const foot = document.getElementById(container.id + '-foot');
      if (foot) foot.innerHTML = legend;
    }

    /* ===== 折柱图（堆积柱+折线，双Y轴） ===== */
    function renderComboChart(container, xLabels, barSeries, lineValues, lineLabel, showRightAxis) {
      const n = xLabels.length;
      const w = Math.max(600, n * 60), h = 280, pad = { t:20, r:45, b:30, l:50 };
      const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
      const stepX = cw / n;
      const barW = stepX * 0.5;

      // 柱状图Y轴（左）：规模
      const totals = xLabels.map((_, i) => barSeries.reduce((s, r) => s + r.values[i], 0));
      const maxBar = Math.max(...totals, 1);
      const barTicks = [0, maxBar * 0.25, maxBar * 0.5, maxBar * 0.75, maxBar];

      // 折线Y轴（右）：增速%
      const validLine = lineValues.filter(v => v !== null && v !== undefined);
      const hasLine = validLine.length > 0 && showRightAxis !== false;
      const lineMin = Math.min(...validLine, -8);
      const lineMax = Math.max(...validLine, 5);
      const lineRange = lineMax - lineMin || 1;

      // 图例
      const legendItems = barSeries.slice().reverse().map(r =>
        `<span class="legend-item"><span class="legend-dot" style="background:${r.color}"></span>${r.name}</span>`
      ).join('') + (hasLine ? `<span class="legend-item"><span style="width:12px;height:2px;background:${C_LINE};display:inline-block;border-radius:1px;"></span>${lineLabel}</span>` : '');

      // 网格线
      const grid = barTicks.map(v => {
        const y = pad.t + ch - (v / maxBar) * ch;
        return `<line class="grid-line" x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke-dasharray="3,3" />`;
      }).join('');

      // 左Y轴标签
      const yLeft = barTicks.map(v => {
        const y = pad.t + ch - (v / maxBar) * ch;
        return `<text class="axis-label" x="${pad.l-4}" y="${y+3}" text-anchor="end">${Math.round(v)}</text>`;
      }).join('');

      // 右Y轴标签（%）— 仅在有折线数据时显示
      var yRight = '';
      if (hasLine) {
        const yRightTicks = [lineMin, lineMin + lineRange * 0.5, lineMin + lineRange, 0].filter((v, i, a) => a.indexOf(v) === i);
        yRight = yRightTicks.map(v => {
          const y = pad.t + ch - ((v - lineMin) / lineRange) * ch;
          return `<text class="axis-label" x="${w-pad.r+4}" y="${y+3}" text-anchor="start">${v.toFixed(1)}%</text>`;
        }).join('');
      }

      // 堆积柱
      const bars = xLabels.map((label, i) => {
        const x = pad.l + i * stepX + (stepX - barW) / 2;
        let accY = pad.t + ch; // 从底开始
        const segs = barSeries.map(r => {
          const segH = (r.values[i] / maxBar) * ch;
          accY -= segH;
          return `<rect x="${x}" y="${accY}" width="${barW}" height="${segH}" fill="${r.color}" />`;
        }).join('');
        // 柱顶总计
        const total = totals[i];
        const totalY = pad.t + ch - (total / maxBar) * ch;
        return `${segs}<text class="bar-label" x="${x + barW/2}" y="${totalY - 4}" text-anchor="middle">${total}</text>`;
      }).join('');

      // X轴标签
      const xLabels2 = xLabels.map((l, i) =>
        `<text class="axis-label" x="${pad.l + i*stepX + stepX/2}" y="${h-8}" text-anchor="middle">${l}</text>`
      ).join('');

      // 折线（同比增速）
      const lineColor = C_LINE;
      const linePts = [];
      const lineDots = [];
      lineValues.forEach((v, i) => {
        if (v === null || v === undefined) return;
        const x = pad.l + i * stepX + stepX / 2;
        const y = pad.t + ch - ((v - lineMin) / lineRange) * ch;
        linePts.push(`${x},${y}`);
        lineDots.push(`<circle cx="${x}" cy="${y}" r="3.5" fill="${lineColor}" stroke="#fff" stroke-width="1.5" />`);
        // 数据标签
        const labelY = v < 0 ? y + 14 : y - 8;
        const fillColor = v < 0 ? '#EF4444' : lineColor;
        lineDots.push(`<text class="line-label" x="${x}" y="${labelY}" text-anchor="middle" fill="${fillColor}">${v > 0 ? '+' : ''}${v}%</text>`);
      });
      const polyline = linePts.length > 0 ? `<polyline points="${linePts.join(' ')}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />` : '';

      // 0轴线 — 仅在有折线数据时显示
      var zeroLine = '';
      if (hasLine) {
        const zeroY = pad.t + ch - ((0 - lineMin) / lineRange) * ch;
        zeroLine = `<line x1="${pad.l}" y1="${zeroY}" x2="${w-pad.r}" y2="${zeroY}" stroke="#DCE5F0" stroke-width="1" />`;
      }

      // 坐标轴线（左Y轴 + 底部X轴；右Y轴仅在有折线时显示）
      var rightAxis = hasLine ? `<line x1="${w-pad.r}" y1="${pad.t}" x2="${w-pad.r}" y2="${pad.t+ch}" stroke="var(--border)" stroke-width="1" />` : '';
      const axisLines = `<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t+ch}" stroke="var(--border)" stroke-width="1" />${rightAxis}<line x1="${pad.l}" y1="${pad.t+ch}" x2="${w-pad.r}" y2="${pad.t+ch}" stroke="var(--border)" stroke-width="1" />`;

      container.innerHTML = `<svg class="combo-viz" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${grid}${axisLines}${zeroLine}${bars}${yLeft}${yRight}${xLabels2}${polyline}${lineDots.join('')}</svg>`;
      const foot = document.getElementById(container.id + '-foot');
      if (foot) foot.innerHTML = legendItems;
    }

    /* ===== 折柱图：堆积柱(占比100%) + 折线(渗透率) 双Y轴 ===== */
    function renderStackedCombo(container, xLabels, barSeries, lineValues, lineLabel, showRightAxis) {
      const n = xLabels.length;
      const w = Math.max(600, n * 80), h = 280, pad = { t:20, r:45, b:30, l:45 };
      const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
      const stepX = cw / n, barW = stepX * 0.5;
      const hasLine = !!(lineValues && lineValues.some(v => v !== null && v !== undefined));
      const showRight = hasLine && showRightAxis !== false;

      // 图例
      const legendItems = barSeries.slice().reverse().map(r =>
        `<span class="legend-item"><span class="legend-dot" style="background:${r.color}"></span>${r.name}</span>`
      ).join('') + (hasLine ? `<span class="legend-item"><span style="width:12px;height:2px;background:${C_LINE};display:inline-block;border-radius:1px;"></span>${lineLabel}</span>` : '');

      // 网格线 (0%, 25%, 50%, 75%, 100%)
      const grid = [0, 0.25, 0.5, 0.75, 1].map(p => {
        const y = pad.t + ch - p * ch;
        return `<line class="grid-line" x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke-dasharray="3,3" />`;
      }).join('');
      const axisLines = `<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t+ch}" stroke="var(--border)" stroke-width="1" />` + (showRight ? `<line x1="${w-pad.r}" y1="${pad.t}" x2="${w-pad.r}" y2="${pad.t+ch}" stroke="var(--border)" stroke-width="1" />` : '') + `<line x1="${pad.l}" y1="${pad.t+ch}" x2="${w-pad.r}" y2="${pad.t+ch}" stroke="var(--border)" stroke-width="1" />`;

      // 左Y轴标签
      const yLeft = [0, 25, 50, 75, 100].map(p => {
        const y = pad.t + ch - (p/100) * ch;
        return `<text class="axis-label" x="${pad.l-4}" y="${y+3}" text-anchor="end">${p}%</text>`;
      }).join('');

      // 右Y轴标签（NEV渗透率%）— 仅在有折线数据且允许右轴时显示
      var yRight = '';
      if (showRight) {
        const lineMax = Math.max(...lineValues, 80);
        const lineMin = 0;
        const lineRange = lineMax - lineMin || 1;
        const yRightTicks = [0, lineMax * 0.25, lineMax * 0.5, lineMax * 0.75, lineMax];
        yRight = yRightTicks.map(v => {
          const y = pad.t + ch - (v / lineMax) * ch;
          return `<text class="axis-label" x="${w-pad.r+4}" y="${y+3}" text-anchor="start">${Math.round(v)}%</text>`;
        }).join('');
      }

      // 堆积柱
      const bars = xLabels.map((label, i) => {
        const x = pad.l + i * stepX + (stepX - barW) / 2;
        let accY = pad.t + ch;
        const segs = barSeries.map(r => {
          const segH = r.values[i] * ch;
          accY -= segH;
          const pct = (r.values[i] * 100).toFixed(1);
          const textColor = r.name === 'EV' || r.name === 'XEV' || r.name === 'HEV' ? '#374151' : '#fff';
          return `<rect x="${x}" y="${accY}" width="${barW}" height="${segH}" fill="${r.color}" />` +
                 (segH > 16 ? `<text class="seg-label" x="${x + barW/2}" y="${accY + segH/2 + 3}" text-anchor="middle" fill="${textColor}">${pct}%</text>` : '');
        }).join('');
        return segs;
      }).join('');

      // X轴标签
      const xLabels2 = xLabels.map((l, i) =>
        `<text class="axis-label" x="${pad.l + i*stepX + stepX/2}" y="${h-8}" text-anchor="middle">${l}</text>`
      ).join('');

      // 折线（NEV渗透率）
      const lineColor = C_LINE;
      const linePts = [];
      const lineDots = [];
      if (hasLine) {
        const lineMaxLocal = Math.max(...lineValues, 80);
        lineValues.forEach((v, i) => {
          const x = pad.l + i * stepX + stepX / 2;
          const y = pad.t + ch - (v / lineMaxLocal) * ch;
          linePts.push(`${x},${y}`);
          lineDots.push(`<circle cx="${x}" cy="${y}" r="3" fill="${lineColor}" stroke="#fff" stroke-width="1.5" />`);
          lineDots.push(`<text class="line-label" x="${x}" y="${y - 7}" text-anchor="middle" fill="${lineColor}">${v}%</text>`);
        });
      }
      const polyline = `<polyline points="${linePts.join(' ')}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />`;

      container.innerHTML = `<svg class="combo-viz" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${grid}${axisLines}${bars}${yLeft}${yRight}${xLabels2}${polyline}${lineDots.join('')}</svg>`;
      const foot = document.getElementById(container.id + '-foot');
      if (foot) foot.innerHTML = legendItems;
    }

    /* ===== 堆积柱状图 SVG（占比，带百分比标签） ===== */
    function renderStackedSVG(container, xLabels, series, normalize) {
      const n = xLabels.length;
      const w = Math.max(500, n * 80), h = 280, pad = { t:20, r:20, b:30, l:45 };
      const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
      const stepX = cw / n;
      const barW = stepX * 0.45;

      const legendItems = series.slice().reverse().map(r =>
        `<span class="legend-item"><span class="legend-dot" style="background:${r.color}"></span>${r.name}</span>`
      ).join('');
      const totals = xLabels.map(function(_, i) { return series.reduce(function(sum, r) { return sum + (r.values[i] || 0); }, 0); });
      const maxTotal = Math.max.apply(null, totals.concat([1]));
      const scaleMax = normalize === false ? maxTotal : 1;
      const grid = [0, 0.25, 0.5, 0.75, 1].map(p => {
        const y = pad.t + ch - p * ch;
        return `<line class="grid-line" x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke-dasharray="3,3" />`;
      }).join('');
      const axisLines = `<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t+ch}" stroke="var(--border)" stroke-width="1" /><line x1="${pad.l}" y1="${pad.t+ch}" x2="${w-pad.r}" y2="${pad.t+ch}" stroke="var(--border)" stroke-width="1" />`;
      const yLeft = [0, 0.25, 0.5, 0.75, 1].map(function(p) {
        const y = pad.t + ch - p * ch;
        const value = normalize === false ? Math.round(p * scaleMax) : Math.round(p * 100) + '%';
        return `<text class="axis-label" x="${pad.l-4}" y="${y+3}" text-anchor="end">${value}</text>`;
      }).join('');
      const bars = xLabels.map((label, i) => {
        const x = pad.l + i * stepX + (stepX - barW) / 2;
        let accY = pad.t + ch;
        const segs = series.map(r => {
          const rawValue = r.values[i] || 0;
          const value = normalize === false ? rawValue : (totals[i] ? rawValue / totals[i] : 0);
          const segH = value / scaleMax * ch;
          accY -= segH;
          const displayValue = normalize === false ? rawValue : Math.round(value * 100) + '%';
          const textColor = r.name === 'EV' || r.name === 'XEV' ? '#374151' : '#fff';
          return `<rect x="${x}" y="${accY}" width="${barW}" height="${segH}" fill="${r.color}" />` +
                 (segH > 18 ? `<text class="seg-label" x="${x + barW/2}" y="${accY + segH/2 + 3}" text-anchor="middle" fill="${textColor}">${displayValue}</text>` : '');
        }).join('');
        return segs;
      }).join('');

      // X轴标签
      const xLabels2 = xLabels.map((l, i) =>
        `<text class="axis-label" x="${pad.l + i*stepX + stepX/2}" y="${h-8}" text-anchor="middle">${l}</text>`
      ).join('');

      container.innerHTML = `<svg class="combo-viz" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${grid}${axisLines}${bars}${yLeft}${xLabels2}</svg>`;
      const foot = document.getElementById(container.id + '-foot');
      if (foot) foot.innerHTML = legendItems;
    }

    /* 饼图统一色卡 — 启源蓝渐变 + 品牌橙系 */
    var PIE_PALETTE = ['#2E5F95', '#5AA0E6', '#8FC0EF', '#BFDCF6', '#E68620', '#F0A94D', '#6B7280', '#9CA3AF', '#D1D5DB', '#374151'];

    function renderPieChart(container, labels, values, colors) {
      var palette = (colors && colors.length >= values.length) ? colors : PIE_PALETTE;
      const total = values.reduce((a, b) => a + b, 0);
      const cx = 140, cy = 110, r = 90;
      let angle = -Math.PI / 2;
      const arcs = values.map((v, i) => {
        const slice = (v / total) * Math.PI * 2;
        const x1 = cx + Math.cos(angle) * r;
        const y1 = cy + Math.sin(angle) * r;
        angle += slice;
        const x2 = cx + Math.cos(angle) * r;
        const y2 = cy + Math.sin(angle) * r;
        const large = slice > Math.PI ? 1 : 0;
        var fill = palette[i % palette.length];
        return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${fill}" />`;
      }).join('');
      const legend = labels.map((l, i) => {
        const pct = ((values[i] / total) * 100).toFixed(1);
        var fill = palette[i % palette.length];
        return `<div class="pie-legend-item"><span class="legend-dot" style="background:${fill};width:9px;height:9px;border-radius:2px;display:inline-block;"></span>${l}<span class="pie-legend-val">${pct}%</span></div>`;
      }).reverse().join('');
      container.innerHTML = `<svg class="pie-viz-svg" viewBox="0 0 280 220" preserveAspectRatio="xMidYMid meet">${arcs}<circle cx="${cx}" cy="${cy}" r="35" fill="#fff" /><text x="${cx}" y="${cy+3}" text-anchor="middle" font-size="11" fill="var(--text-2)" font-weight="600">总计</text></svg>`;
      const foot = document.getElementById(container.id + '-foot');
      if (foot) foot.innerHTML = legend;
    }

    function renderAreaCombo(container, labels, series, lineValues, lineLabel) {
      var n = labels.length, w = Math.max(600, n * 70), h = 280, pad = { t:20, r:45, b:30, l:45 };
      var cw = w - pad.l - pad.r, ch = h - pad.t - pad.b, stepX = cw / (n - 1 || 1);
      var colors = ['#2E5F95', '#5AA0E6', '#8FC0EF', '#E68620', '#10B981', '#7C3AED'];
      var totals = labels.map(function(_, i) { return series.reduce(function(sum, s) { return sum + (s.values[i] || 0); }, 0); });
      var maxVal = Math.max.apply(null, totals.concat([1]));
      var grid = [0,.25,.5,.75,1].map(function(p) { var y = pad.t + ch - p * ch; return '<line class="grid-line" x1="' + pad.l + '" y1="' + y + '" x2="' + (w-pad.r) + '" y2="' + y + '" stroke-dasharray="3,3" />'; }).join('');
      var areas = '', cumulative = labels.map(function() { return 0; });
      series.forEach(function(s, si) {
        var top = s.values.map(function(v, i) { return [pad.l + i * stepX, pad.t + ch - ((cumulative[i] + v) / maxVal) * ch]; });
        var bottom = s.values.map(function(v, i) { return [pad.l + i * stepX, pad.t + ch - (cumulative[i] / maxVal) * ch]; }).reverse();
        areas += '<path d="M' + top.concat(bottom).map(function(p) { return p[0] + ',' + p[1]; }).join(' L') + ' Z" fill="' + colors[si % colors.length] + '" fill-opacity=".48" stroke="' + colors[si % colors.length] + '" stroke-width="1" />';
        s.values.forEach(function(v, i) { cumulative[i] += v; });
      });
      var lineMax = Math.max.apply(null, (lineValues || []).filter(function(v) { return v != null; }).concat([1]));
      var linePoints = (lineValues || []).map(function(v, i) { if (v == null) return null; return [pad.l + i * stepX, pad.t + ch - v / lineMax * ch]; }).filter(Boolean);
      var line = linePoints.length ? '<polyline points="' + linePoints.map(function(p) { return p.join(','); }).join(' ') + '" fill="none" stroke="#E68620" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />' + linePoints.map(function(p, i) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3" fill="#E68620" stroke="#fff" stroke-width="1.5" />'; }).join('') : '';
      var axisLines = '<line x1="' + pad.l + '" y1="' + pad.t + '" x2="' + pad.l + '" y2="' + (pad.t + ch) + '" stroke="var(--border)" stroke-width="1" />' +
        (linePoints.length ? '<line x1="' + (w - pad.r) + '" y1="' + pad.t + '" x2="' + (w - pad.r) + '" y2="' + (pad.t + ch) + '" stroke="var(--border)" stroke-width="1" />' : '') +
        '<line x1="' + pad.l + '" y1="' + (pad.t + ch) + '" x2="' + (w - pad.r) + '" y2="' + (pad.t + ch) + '" stroke="var(--border)" stroke-width="1" />';
      var yLabels = [0, .25, .5, .75, 1].map(function(p) { var y = pad.t + ch - p * ch; return '<text class="axis-label" x="' + (pad.l - 4) + '" y="' + (y + 3) + '" text-anchor="end">' + Math.round(p * maxVal) + '</text>'; }).join('');
      var yRight = linePoints.length ? [0, .25, .5, .75, 1].map(function(p) { var y = pad.t + ch - p * ch; return '<text class="axis-label" x="' + (w - pad.r + 4) + '" y="' + (y + 3) + '" text-anchor="start">' + Math.round(p * lineMax) + '</text>'; }).join('') : '';
      var xLabels = labels.map(function(l, i) { return '<text class="axis-label" x="' + (pad.l + i * stepX) + '" y="' + (h-8) + '" text-anchor="middle">' + l + '</text>'; }).join('');
      var legend = series.map(function(s, i) { return '<span class="legend-item"><span class="legend-dot" style="background:' + colors[i % colors.length] + '"></span>' + s.name + '</span>'; }).reverse().join('') + (line ? '<span class="legend-item"><span style="width:12px;height:2px;background:#E68620;display:inline-block"></span>' + lineLabel + '</span>' : '');
      container.innerHTML = '<svg class="combo-viz" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet">' + grid + axisLines + areas + line + yLabels + yRight + xLabels + '</svg>';
      var foot = document.getElementById(container.id + '-foot');
      if (foot) foot.innerHTML = legend;
    }

    function renderBubbleChart(container, labels, series) {
      var w = Math.max(500, labels.length * 60), h = 280, pad = { t:35, r:25, b:30, l:45 };
      var cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
      var maxVal = Math.max.apply(null, series.flatMap(function(s) { return s.values; }).concat([1]));
      var maxR = 7 + Math.sqrt(1) * 18, inset = maxR + 2;
      var plotX0 = pad.l + inset, plotX1 = w - pad.r - inset, plotW = Math.max(plotX1 - plotX0, 1);
      var plotY0 = pad.t + inset, plotY1 = pad.t + ch - inset, plotH = Math.max(plotY1 - plotY0, 1);
      function bubbleX(i) { return plotX0 + (labels.length === 1 ? plotW / 2 : i * plotW / (labels.length - 1)); }
      var colors = ['#2E5F95', '#E68620', '#10B981', '#7C3AED', '#F59E0B', '#6B7280'];
      var grid = [0, .25, .5, .75, 1].map(function(p) { var y = pad.t + ch - p * ch; return '<line class="grid-line" x1="' + pad.l + '" y1="' + y + '" x2="' + (w - pad.r) + '" y2="' + y + '" stroke-dasharray="3,3" />'; }).join('');
      var axisLines = '<line x1="' + pad.l + '" y1="' + pad.t + '" x2="' + pad.l + '" y2="' + (pad.t + ch) + '" stroke="var(--border)" stroke-width="1" />' +
        '<line x1="' + pad.l + '" y1="' + (pad.t + ch) + '" x2="' + (w - pad.r) + '" y2="' + (pad.t + ch) + '" stroke="var(--border)" stroke-width="1" />';
      var yLabels = [0, .25, .5, .75, 1].map(function(p) { var y = pad.t + ch - p * ch; return '<text class="axis-label" x="' + (pad.l - 4) + '" y="' + (y + 3) + '" text-anchor="end">' + Math.round(p * maxVal) + '</text>'; }).join('');
      var points = series.map(function(s, si) { return s.values.map(function(v, i) { var x = bubbleX(i); var y = plotY1 - v / maxVal * plotH; var r = 7 + Math.sqrt(Math.max(v, 0) / maxVal) * 18; return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + colors[si % colors.length] + '" fill-opacity=".72" stroke="#fff" stroke-width="1.5"><title>' + s.name + ' · ' + labels[i] + ': ' + v + '</title></circle><text class="bar-label" x="' + x + '" y="' + (y + 3) + '" text-anchor="middle" fill="#fff">' + v + '</text>'; }).join(''); }).join('');
      var xLabels = labels.map(function(l, i) { var x = bubbleX(i); return '<text class="axis-label" x="' + x + '" y="' + (h - 8) + '" text-anchor="middle">' + l + '</text>'; }).join('');
      var legend = series.map(function(s, i) { return '<span class="legend-item"><span class="legend-dot" style="background:' + colors[i % colors.length] + '"></span>' + s.name + '</span>'; }).reverse().join('');
      container.innerHTML = '<svg class="combo-viz" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet">' + grid + axisLines + points + yLabels + xLabels + '</svg>';
      var foot = document.getElementById(container.id + '-foot');
      if (foot) foot.innerHTML = legend;
    }

    function renderTableChart(container, labels, series, xLabel) {

    function scaleYearLabel() {
      if (scaleYearsSel.length >= SCALE_VERSIONS.length) return '年份：全部年份';
      var txt = scaleYearsSel.join('、');
      if (txt.length <= 18) return '年份：' + txt;
      return '年份：' + scaleYearsSel.slice(0, 2).join('、') + ' 等' + scaleYearsSel.length + '个';
    }

    function scaleYearOptionsHtml() {
      return SCALE_VERSIONS.map(function(y) {
        var checked = scaleYearsSel.indexOf(y) > -1;
        var lastOne = checked && scaleYearsSel.length === 1;
        return '<label class="chart-filter-opt' + (checked ? ' checked' : '') + (lastOne ? ' disabled' : '') + '" onclick="scaleYearToggle(\'' + y + '\', event)">'
          + '<input type="checkbox"' + (checked ? ' checked' : '') + (lastOne ? ' disabled' : '') + '>'
          + '<span class="cf-opt-name">' + y + '</span>'

    function refreshScaleYearControl() {
      var label = document.getElementById('scale-year-label');

    function toggleScaleYearPanel(ev) {

      wrap.classList.toggle('open');
      refreshScaleYearControl();

    function scaleYearSelectAll(ev) {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      scaleYearsSel = SCALE_VERSIONS.slice();
      refreshScaleYearControl();
      updateScaleChart();
    }

    function scaleYearToggle(y, ev) {
      if (ev && ev.preventDefault) ev.preventDefault();
      var idx = scaleYearsSel.indexOf(y);
      if (idx > -1) {
        if (scaleYearsSel.length <= 1) return; // 至少保留一个年份
        scaleYearsSel.splice(idx, 1);
      } else {
        scaleYearsSel.push(y);
      }
      scaleYearsSel = SCALE_VERSIONS.filter(function(v) { return scaleYearsSel.indexOf(v) > -1; });
      refreshScaleYearControl();
      updateScaleChart();
