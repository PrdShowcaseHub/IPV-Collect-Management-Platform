    };
    const CC_TYPE_NAMES = { bar: '簇状柱形图', stackedBar: '堆积柱形图', percentBar: '百分比堆积柱形图', line: '折线图（无数据标记）', lineMarkers: '折线图（带数据标记）', combo: '折柱图', percentCombo: '折柱图（带百分比）', areaCombo: '折柱图（堆积面积）', bubble: '单气泡图', pie: '饼图', table: '表格' };

    let ccRawDataCache = null;

    function ccGenerateRawData() {
      if (ccRawDataCache) return ccRawDataCache;
      const rows = [];
      const regionCountries = {
        '中国': ['中国'], '欧洲': ['德国', '法国'], '中南美': ['巴西'],
        '东南亚': ['泰国'], '中东非': ['阿联酋'], '欧亚': ['日本', '韩国']
      };
      const regions = Object.keys(regionCountries);
      const years = ['2024', '2025', '2026', '2027F'];
      const versions = ['2026-A-IPV【Publish_0815】', '2026-B-IPV【Publish_0720】', '2026-A-IPV【Update_0810】', '2026-B-IPV【Update_0705】'];
      regions.forEach(function(region, regionIndex) {
        years.forEach(function(year, yearIndex) {
          regionCountries[region].forEach(function(country, countryIndex) {
            ['PV', 'LCV'].forEach(function(body, bodyIndex) {
              const seed = regionIndex * 31 + yearIndex * 17 + countryIndex * 7 + bodyIndex * 13;
              rows.push({
                'IPV版本': versions[(yearIndex + bodyIndex) % versions.length],
                '区域': region, '年份': year, '国家': country, '车身大类': body,
                '品类': body === 'PV' ? (bodyIndex ? 'SUV' : '轿车') : '皮卡',
                '品种': ['紧凑型', '中型', '中大型'][seed % 3], '车格': ['A级', 'B级', 'C级'][seed % 3],
                '动力': ['ICE', 'HEV', 'XEV', 'EV'][seed % 4], '价格段': ['10-20万', '20-30万', '30-50万'][seed % 3],
                '法规聚类': ['高标', '右低', '左低'][seed % 3], '目标市场': seed % 3 === 0 ? '否' : '是', '重点国家': seed % 4 === 0 ? '否' : '是',
                '规模(万辆)': 500 + seed * 23 + yearIndex * 80, '增速(%)': +(5 + (seed % 18) * 0.7 - yearIndex * 0.4).toFixed(1),
                '占比(%)': +(18 + (seed % 24) * 1.3).toFixed(1), '车型数量': 8 + seed % 43
              });
            });
          });
        });
      });
      ccRawDataCache = rows;
      return rows;
    }

    function ccConvertLegacyFilters(filtersObj) {
      const rows = [];
      Object.keys(filtersObj || {}).forEach(function(key) {
        const value = filtersObj[key];
        if (key === 'IPV版本') return;
        if (!value || value === '全部' || (key === '区域' && value === '全球')) return;
        rows.push({ dim: key, values: [value] });
      });
      return rows;
    }

    function ccEnsureFilterRows() {
      if (!Array.isArray(ccState.filterRows)) {
        ccState.filterRows = ccConvertLegacyFilters(ccState.filters || {});
      }
    }

    function ccGetFilterRows() {
      const source = Array.isArray(ccState.filterRows) ? ccState.filterRows : ccConvertLegacyFilters(ccState.filters || {});
      return source.map(function(r) {
        return { dim: r.dim, values: Array.isArray(r.values) ? r.values.slice() : [] };
      }).filter(function(r) { return r.dim; });
    }

    function ccGetDimValueOptions(dimKey) {
      const def = CC_FIELDS.find(function(f) { return f.key === dimKey && f.type === 'dim'; });
      const opts = (def && def.options ? def.options.slice() : []);
      const seen = {};
      opts.forEach(function(o) { seen[o] = 1; });
      ccGenerateRawData().forEach(function(row) {
        const v = row[dimKey];
        if (v != null && v !== '' && !seen[v]) { seen[v] = 1; opts.push(v); }
      });
      return opts;
    }

    function ccGetFilteredData() {
      const rows = ccGetFilterRows();
      const legacyVersion = (ccState.filters || {})['IPV版本'];
      let targetVersion = ccState.version;
      if (legacyVersion && legacyVersion !== '全部' && legacyVersion !== '当前最新版本') targetVersion = legacyVersion;
      return ccGenerateRawData().filter(function(row) {
        if (targetVersion && row['IPV版本'] !== targetVersion) return false;
        return rows.every(function(f) {
          if (!f.values || !f.values.length) return true;
          return f.values.indexOf(row[f.dim]) !== -1;
        });
      });
    }

    function ccRenderFilterHead() {
      const head = document.getElementById('cc-filter-head');
      if (!head) return;
      const rows = ccGetFilterRows();
      const activeCount = rows.filter(function(r) { return r.values && r.values.length; }).length;
      const comboOpts = ['<option value="">选择常用筛选组合…</option>'].concat(ccFilterCombos.map(function(c) {
        return '<option value="' + c.id + '"' + (c.id === ccComboSelectedId ? ' selected' : '') + '>' + escapeHtml(c.name) + '</option>';
      })).join('');
      head.innerHTML =
        '<div class="cc-filter-head-top">' +
        '<span class="cc-filter-count">' + (activeCount ? activeCount + ' / ' + DIMENSIONS.length + ' 个维度已筛选' : '未设置筛选') + '</span>' +
        '<span class="cc-filter-hint">维度内多选为“或”，不同维度之间为“并且”；点「全部」该维度即不参与过滤</span>' +
        '</div>' +
        '<div class="cc-combo-row"><select class="cc-combo-select" onchange="ccOnComboChange(this.value)">' + comboOpts + '</select></div>' +
        '<div class="cc-filter-actions">' +
        '<button class="cc-btn" title="将当前筛选条件保存为常用组合" ' + (activeCount ? '' : 'disabled') + ' onclick="ccStartSaveCombo()">另存为组合</button>' +
        '<button class="cc-btn danger" title="删除当前选中的组合" ' + (ccComboSelectedId ? '' : 'disabled') + ' onclick="ccStartDeleteCombo()">删除组合</button>' +
        '<button class="cc-btn cc-btn-clear" title="清空全部维度的筛选值" ' + (activeCount ? '' : 'disabled') + ' onclick="ccClearAllFilters()">清空筛选</button>' +
        '</div>' +
        (ccComboEditActive ?
          '<div class="cc-combo-edit"><span style="font-size:11px;color:var(--text-3);">组合名称</span><input class="cc-combo-name-input" placeholder="如：中国 · 2025 · SUV" value="' + escapeHtml(ccComboDraftName) + '" oninput="ccComboDraftName=this.value" onkeydown="if(event.key===\'Enter\')ccConfirmSaveCombo()" /><button class="cc-btn primary" onclick="ccConfirmSaveCombo()">保存</button><button class="cc-btn" onclick="ccCancelSaveCombo()">取消</button></div>'
          : '');
    }

    function ccRenderFilterRows() {
      const wrap = document.getElementById('cc-filter-rows');
      if (!wrap) return;
      const rows = ccGetFilterRows();
      const rowValuesOf = function(dim) {
        const found = rows.find(function(r) { return r.dim === dim; });
        return (found && found.values) || [];
      };
      const q = function(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); };
      wrap.innerHTML = DIMENSIONS.map(function(d) {
        const values = rowValuesOf(d.key);
        const chips = ['<span class="cc-val-chip all' + (values.length === 0 ? ' on' : '') + '" onclick="ccFilterValueToggleAll(\'' + q(d.key) + '\')">全部</span>'];
        ccGetDimValueOptions(d.key).forEach(function(o) {
          chips.push('<span class="cc-val-chip' + (values.indexOf(o) !== -1 ? ' on' : '') + '" onclick="ccFilterValueToggle(\'' + q(d.key) + '\',\'' + q(o) + '\')">' + escapeHtml(o) + '</span>');
        });
        return '<div class="cc-filter-dim-row">' +
          '<div class="cc-filter-dim-label"><span class="cc-field-tag dim">D</span>' + escapeHtml(d.label || d.key) + '</div>' +
          '<div class="cc-filter-dim-vals">' + chips.join('') + '</div>' +
          '</div>';
      }).join('');
    }

    function ccRenderFilterBar() {
      ccRenderFilterHead();
      ccRenderFilterRows();
    }

    function ccGetOrCreateFilterRow(dim) {
      ccEnsureFilterRows();
      const rows = ccState.filterRows;
      let row = rows.find(function(r) { return r.dim === dim; });
      if (!row) { row = { dim: dim, values: [] }; rows.push(row); }
      return row;
    }

    function ccFilterValueToggle(dim, value) {
      ccComboSelectedId = '';
      const row = ccGetOrCreateFilterRow(dim);
      const values = row.values = (row.values || []).slice();
      const pos = values.indexOf(value);
      if (pos === -1) values.push(value); else values.splice(pos, 1);
      ccRenderFilterBar();
      ccRenderPreview();
    }

    function ccFilterValueToggleAll(dim) {
      ccComboSelectedId = '';
      const row = ccGetOrCreateFilterRow(dim);
      row.values = [];
      ccRenderFilterBar();
      ccRenderPreview();
    }

    function ccClearAllFilters() {
      ccEnsureFilterRows();
      ccComboSelectedId = '';
      ccComboEditActive = false;
      (ccState.filterRows || []).forEach(function(r) { r.values = []; });
      ccRenderFilterBar();
      ccRenderPreview();
    }

    function ccStartSaveCombo() {
      ccComboDraftName = '';
      ccComboEditActive = true;
      ccRenderFilterHead();
      const input = document.querySelector('#cc-filter-head .cc-combo-name-input');
      if (input) input.focus();
    }

    function ccCancelSaveCombo() {
      ccComboEditActive = false;
      ccRenderFilterHead();
    }

    function ccConfirmSaveCombo() {
      const name = (ccComboDraftName || '').trim();
      const rows = ccGetFilterRows().filter(function(r) { return r.values && r.values.length; }).map(function(r) { return { dim: r.dim, values: r.values.slice() }; });
      if (!name || !rows.length) { ccComboDraftName = ''; ccComboEditActive = false; ccRenderFilterHead(); return; }
      const existing = ccFilterCombos.find(function(c) { return c.name === name; });
      if (existing) {
        existing.rows = rows;
        ccComboSelectedId = existing.id;
      } else {
        const combo = { id: 'fc_' + Date.now(), name: name, rows: rows };
        ccFilterCombos.push(combo);
        ccComboSelectedId = combo.id;
      }
      ccComboDraftName = '';
      ccComboEditActive = false;
      ccRenderFilterHead();
    }

    function ccOnComboChange(id) {
      ccComboSelectedId = id || '';
      ccComboEditActive = false;
      const combo = ccFilterCombos.find(function(c) { return c.id === id; });
      if (!combo) return;
      ccState.filterRows = JSON.parse(JSON.stringify(combo.rows));
      ccRenderFilterBar();
      ccRenderPreview();
    }

    function ccStartDeleteCombo() {
      const combo = ccFilterCombos.find(function(c) { return c.id === ccComboSelectedId; });
      if (!combo) return;
      openConfirm({
        title: '删除筛选组合',
        desc: '确定删除常用筛选组合「' + combo.name + '」吗？删除后不影响当前图表的筛选条件。',
        okText: '删除', cancelText: '取消',
        onOk: function() {
          ccFilterCombos = ccFilterCombos.filter(function(c) { return c.id !== ccComboSelectedId; });
          ccComboSelectedId = '';
          ccRenderFilterHead();
        }
      });
    }

    function ccAggregateData(rows) {
      const slots = ccState.slots || {};
      const xField = (slots.x && slots.x[0] || {}).field || '区域';
      const yField = (slots.y && slots.y[0] || {}).field || '规模(万辆)';
      const groupField = (slots.g && slots.g[0] || {}).field || '';
      const labels = [];
      const grouped = {};
      (rows || []).forEach(function(row) {
        const label = row[xField] == null ? '未设置' : String(row[xField]);
        const group = groupField ? (row[groupField] == null ? '未设置' : String(row[groupField])) : yField;
        if (!labels.includes(label)) labels.push(label);
        if (!grouped[group]) grouped[group] = {};
        grouped[group][label] = (grouped[group][label] || 0) + Number(row[yField] || 0);
      });
      const series = Object.keys(grouped).map(function(name) {
        return { name: name, values: labels.map(function(label) { return +(grouped[name][label] || 0).toFixed(1); }) };
      });
      return { labels: labels, series: series };
    }

    function openCustomChartModal(chartId) {
      editingChartId = chartId || null;
      const isEdit = !!chartId;
      ccComboSelectedId = '';
      ccComboEditActive = false;
      ccComboDraftName = '';
      const existing = chartId ? customCharts.find(c => c.id === chartId) : null;
      if (existing) {
        ccState = JSON.parse(JSON.stringify(existing.config));
        ccEnsureFilterRows();
      } else {
        ccState = {
          name: '', type: 'bar',
          versionType: '发布版', version: VERSIONS['发布版'][0],
          slots: { x: [{ field: '区域', agg: '' }], y: [{ field: '规模(万辆)', agg: 'SUM' }], y2: [], g: [] },
          filters: {}, filterRows: [],
        };
      }
      ccActiveTab = 'chart';
      let editor = document.getElementById('cc-editor');
      if (!editor) {
        editor = document.createElement('div');
        editor.id = 'cc-editor';
        editor.className = 'cc-editor';
        document.body.appendChild(editor);
      }
      editor.innerHTML = ccBuildEditorHTML(isEdit);
      editor.classList.add('active');
      ccRenderFields();
      ccRenderSlotConfig();
      ccRenderSlots();
      ccRenderTypes();
      ccSetupDropZones();
      ccRenderFilterBar();
      ccRenderPreview();
    }

    function ccBuildEditorHTML(isEdit) {
      const versionOpts = Object.entries(VERSIONS).map(([group, vers]) =>
        '<optgroup label="' + group + '">' + vers.map(v => '<option value="' + v + '"' + (v === ccState.version ? ' selected' : '') + '>' + v + '</option>').join('') + '</optgroup>'
      ).join('');
      return '<div class="cc-editor-top">' +
        '<button class="cc-editor-back" onclick="ccCloseEditor()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>返回</button>' +
        '<div class="cc-editor-title">' + (isEdit ? '编辑图表' : '新建图表') + '</div>' +
        '<input class="cc-editor-name-input" placeholder="输入图表名称" value="' + (ccState.name||'') + '" oninput="ccState.name=this.value" />' +
        '<div class="cc-editor-meta"><span class="cc-version-chip">' + ccState.version + '</span></div>' +
        '<div class="cc-editor-actions"><button class="cc-editor-btn-save" onclick="ccSaveChart()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>' + (isEdit ? '保存修改' : '添加到看板') + '</button></div>' +
        '</div>' +
        '<div class="cc-editor-body">' +
        '<div class="cc-left">' +
        '<div class="cc-left-section"><div class="cc-left-title">数据源</div><div style="font-size:11px;color:var(--text-2);display:flex;align-items:center;gap:5px;"><span style="width:6px;height:6px;border-radius:50%;background:#10B981;"></span>IPV 预测数据（模拟）</div></div>' +
        '<div class="cc-left-section cc-left-fields"><input class="cc-field-search" placeholder="搜索字段..." oninput="ccRenderFields(this.value)" /><div class="cc-field-group-label">维度</div><div id="cc-field-list-dim"></div><div class="cc-field-group-label">度量</div><div id="cc-field-list-metric"></div></div>' +
        '<div class="cc-left-section cc-left-type-section" style="padding:0;"><div style="padding:8px 14px 4px;font-size:10px;font-weight:600;color:var(--text-3);">图表类型</div><div class="cc-type-grid" id="cc-type-grid">' + [['柱形图',['bar','stackedBar','percentBar']],['折线图',['line','lineMarkers']],['折柱图',['combo','percentCombo','areaCombo']],['其他',['bubble','pie','table']]].map(function(group) { return '<div class="cc-type-group"><div class="cc-type-group-title">' + group[0] + '</div><div class="cc-type-group-options">' + group[1].map(function(type) { return '<div class="cc-type-card ' + (ccState.type === type ? 'active' : '') + '" data-type="' + type + '" onclick="ccSelectType(\'' + type + '\')">' + CC_TYPE_ICONS[type] + '<span>' + CC_TYPE_NAMES[type] + '</span></div>'; }).join('') + '</div></div>'; }).join('') + '</div></div>' +
        '<div class="cc-left-section"><div class="cc-left-title">数据版本</div><div class="cc-version-group"><div class="cc-version-label">版本类型</div><select class="cc-version-select" onchange="ccOnVersionTypeChange(this.value)"><option value="发布版"' + (ccState.versionType === '发布版' ? ' selected' : '') + '>发布版 (Publish)</option><option value="更新版"' + (ccState.versionType === '更新版' ? ' selected' : '') + '>更新版 (Update)</option></select></div><div class="cc-version-group"><div class="cc-version-label">版本号</div><select class="cc-version-select" id="cc-version-select" onchange="ccOnVersionChange(this.value)">' + versionOpts + '</select></div></div>' +
        '</div>' +
        '<div class="cc-middle">' +
        '<div class="cc-panel"><div class="cc-panel-head">字段配置</div><div class="cc-panel-body">' +
        '<div class="cc-slot-row empty" data-slot="x"><div class="cc-slot-label">X 轴</div><div class="cc-slot-drop" id="cc-slot-x"><span class="cc-slot-empty-hint">拖入维度字段</span></div></div>' +
        '<div class="cc-slot-row empty" data-slot="y"><div class="cc-slot-label">Y 轴(柱)</div><div class="cc-slot-drop" id="cc-slot-y"><span class="cc-slot-empty-hint">拖入度量字段</span></div></div>' +
        '<div class="cc-slot-row empty" data-slot="y2"><div class="cc-slot-label">Y2(折线)</div><div class="cc-slot-drop" id="cc-slot-y2"><span class="cc-slot-empty-hint">拖入度量字段（折柱图用）</span></div></div>' +
        '<div class="cc-slot-row empty" data-slot="g"><div class="cc-slot-label">分组</div><div class="cc-slot-drop" id="cc-slot-g"><span class="cc-slot-empty-hint">拖入维度字段（可选）</span></div></div>' +
        '</div></div>' +
        '<div class="cc-panel cc-filter-panel"><div class="cc-panel-head">筛选条件</div>' +
        '<div class="cc-filter-head" id="cc-filter-head"></div>' +
        '<div class="cc-filter-list" id="cc-filter-rows"></div>' +
        '</div>' +
        '</div>' +
        '<div class="cc-right"><div class="cc-preview-tabs"><div class="cc-preview-tab ' + (ccActiveTab==='chart'?'active':'') + '" data-tab="chart" onclick="ccSwitchTab(\'chart\')">图表</div><div class="cc-preview-tab ' + (ccActiveTab==='data'?'active':'') + '" data-tab="data" onclick="ccSwitchTab(\'data\')">原始数据 <span style="opacity:.6" id="cc-row-count"></span></div></div><div class="cc-preview-area" id="cc-preview-area"></div></div>' +
        '</div>';
    }

    function ccCloseEditor() { document.getElementById('cc-editor').classList.remove('active'); }

    function ccRenderFields(search) {
      const dimList = document.getElementById('cc-field-list-dim');
      const metricList = document.getElementById('cc-field-list-metric');
      if (!dimList || !metricList) return;
      const usedFields = new Set([].concat(ccState.slots.x, ccState.slots.y, ccState.slots.y2 || [], ccState.slots.g).map(function(s) { return s.field; }));
      const filterFn = function(f) { return !search || f.name.includes(search); };
      dimList.innerHTML = CC_FIELDS.filter(function(f) { return f.type === 'dim' && filterFn(f); }).map(function(f) {
        const inUse = usedFields.has(f.key);
        return '<div class="cc-field-item ' + (inUse ? 'in-use' : '') + '" draggable="true" data-field="' + f.key + '" ondragstart="ccOnDragStart(event,\'' + f.key + '\')" ondragend="this.classList.remove(\'dragging\')"><span class="cc-field-tag dim">D</span><span class="cc-field-name">' + f.name + '</span></div>';
      }).join('') || '<div style="font-size:10px;color:var(--text-3);padding:4px 8px;">无匹配字段</div>';
      metricList.innerHTML = CC_FIELDS.filter(function(f) { return f.type === 'metric' && filterFn(f); }).map(function(f) {
        const inUse = usedFields.has(f.key);
        return '<div class="cc-field-item ' + (inUse ? 'in-use' : '') + '" draggable="true" data-field="' + f.key + '" ondragstart="ccOnDragStart(event,\'' + f.key + '\')" ondragend="this.classList.remove(\'dragging\')"><span class="cc-field-tag metric">M</span><span class="cc-field-name">' + f.name + '</span></div>';
      }).join('') || '<div style="font-size:10px;color:var(--text-3);padding:4px 8px;">无匹配字段</div>';
    }

    function ccOnDragStart(e, fieldKey) { e.dataTransfer.setData('text/plain', fieldKey); e.target.classList.add('dragging'); }

    function ccSetupDropZones() {
      document.querySelectorAll('.cc-slot-row').forEach(function(row) {
        const slotKey = row.dataset.slot;
        row.addEventListener('dragover', function(e) { e.preventDefault(); row.classList.add('dragover'); });
        row.addEventListener('dragleave', function() { row.classList.remove('dragover','invalid-drop'); });
        row.addEventListener('drop', function(e) {
          e.preventDefault();
          row.classList.remove('dragover','invalid-drop');
          const fieldKey = e.dataTransfer.getData('text/plain');
          const fieldDef = CC_FIELDS.find(function(f) { return f.key === fieldKey; });
          if (!fieldDef) return;
          if (slotKey === 'x' || slotKey === 'g') { if (fieldDef.type !== 'dim') { row.classList.add('invalid-drop'); setTimeout(function() { row.classList.remove('invalid-drop'); }, 800); return; } }
          if (slotKey === 'y' || slotKey === 'y2') { if (fieldDef.type !== 'metric') { row.classList.add('invalid-drop'); setTimeout(function() { row.classList.remove('invalid-drop'); }, 800); return; } }
          ['x','y','y2','g'].forEach(function(k) { ccState.slots[k] = (ccState.slots[k]||[]).filter(function(s) { return s.field !== fieldKey; }); });
          if (slotKey === 'x' || slotKey === 'g') { ccState.slots[slotKey] = [{ field: fieldKey, agg: '' }]; }
          else { ccState.slots[slotKey] = [{ field: fieldKey, agg: 'SUM' }]; }
          ccRenderFields(document.querySelector('.cc-field-search') ? document.querySelector('.cc-field-search').value : '');
          ccRenderSlots();
          ccRenderPreview();
        });
      });
    }

    function ccRenderSlots() {
      var slotCfg = CC_SLOT_CONFIG[ccState.type] || CC_SLOT_CONFIG.bar;
      ['x','y','y2','g'].forEach(function(slotKey) {
        const el = document.getElementById('cc-slot-' + slotKey);
        if (!el) return;
        const row = el.closest('.cc-slot-row');
        if (row.style.display === 'none') return;
        const items = ccState.slots[slotKey] || [];
        var hint = (slotCfg[slotKey] || {}).hint || '拖入字段';
        if (items.length === 0) {
          row.classList.add('empty');
          el.innerHTML = '<span class="cc-slot-empty-hint">' + hint + '</span>';
        } else {
          row.classList.remove('empty');
          el.innerHTML = items.map(function(item, i) {
            const def = CC_FIELDS.find(function(f) { return f.key === item.field; });
            const tagClass = def && def.type === 'dim' ? 'dim' : 'metric';
            const tagText = def && def.type === 'dim' ? 'D' : 'M';
            return '<span class="cc-field-chip"><span class="cc-field-tag ' + tagClass + '" style="width:14px;height:14px;font-size:8px;">' + tagText + '</span>' + (def ? def.name : item.field) + (item.agg ? '<span class="cc-chip-agg">' + item.agg + '</span>' : '') + '<button class="cc-chip-close" onclick="ccRemoveSlot(\'' + slotKey + '\',' + i + ')">×</button></span>';
          }).join('');
        }
      });
    }

    function ccRemoveSlot(slotKey, idx) {
      ccState.slots[slotKey].splice(idx, 1);
      ccRenderFields(document.querySelector('.cc-field-search') ? document.querySelector('.cc-field-search').value : '');
      ccRenderSlots();
      ccRenderPreview();
    }

    /* 各图表类型的槽位配置：visible=是否显示, label=显示名, hint=空提示 */
    const CC_SLOT_CONFIG = {
      bar:   { x: { label:'X 轴', hint:'拖入维度字段' }, y: { label:'Y 轴', hint:'拖入度量字段' }, y2: { visible:false }, g: { label:'分组', hint:'拖入维度字段（可选）' } },
      stackedBar: { x: { label:'X 轴', hint:'拖入维度字段' }, y: { label:'Y 轴', hint:'拖入度量字段' }, y2: { visible:false }, g: { label:'分组', hint:'拖入维度字段（可选）' } },
      percentBar: { x: { label:'X 轴', hint:'拖入维度字段' }, y: { label:'Y 轴', hint:'拖入度量字段' }, y2: { visible:false }, g: { label:'分组', hint:'拖入维度字段（可选）' } },
      line:  { x: { label:'X 轴', hint:'拖入维度字段' }, y: { label:'Y 轴', hint:'拖入度量字段' }, y2: { visible:false }, g: { label:'分组', hint:'拖入维度字段（可选）' } },
      lineMarkers: { x: { label:'X 轴', hint:'拖入维度字段' }, y: { label:'Y 轴', hint:'拖入度量字段' }, y2: { visible:false }, g: { label:'分组', hint:'拖入维度字段（可选）' } },
      combo: { x: { label:'X 轴', hint:'拖入维度字段' }, y: { label:'Y 轴(柱)', hint:'拖入度量字段' }, y2: { label:'Y2(折线)', hint:'拖入度量字段' }, g: { label:'分组', hint:'拖入维度字段（可选）' } },
      percentCombo: { x: { label:'X 轴', hint:'拖入维度字段' }, y: { label:'Y 轴(柱)', hint:'拖入度量字段' }, y2: { label:'Y2(折线)', hint:'拖入度量字段' }, g: { label:'分组', hint:'拖入维度字段（可选）' } },
      areaCombo: { x: { label:'X 轴', hint:'拖入维度字段' }, y: { label:'Y 轴(面积)', hint:'拖入度量字段' }, y2: { label:'Y2(折线)', hint:'拖入度量字段' }, g: { label:'分组', hint:'拖入维度字段（可选）' } },
      bubble: { x: { label:'X 轴', hint:'拖入维度字段' }, y: { label:'气泡大小', hint:'拖入度量字段' }, y2: { visible:false }, g: { label:'分组', hint:'拖入维度字段（可选）' } },
      pie:   { x: { label:'分类', hint:'拖入维度字段' }, y: { label:'值', hint:'拖入度量字段' }, y2: { visible:false }, g: { visible:false } },
      table: { x: { label:'X 轴',     hint:'拖入维度字段'           }, y: { label:'Y 轴',     hint:'拖入度量字段'           }, y2: { visible:false }, g: { label:'分组', hint:'拖入维度字段（可选）' } },
    };

    function ccSelectType(type) {
      ccState.type = type;
      /* 切换类型时清除不再需要的槽位 */
      var slotCfg = CC_SLOT_CONFIG[type] || {};
      Object.keys(slotCfg).forEach(function(k) {
        if (slotCfg[k].visible === false && ccState.slots[k]) {
          ccState.slots[k] = [];
        }
      });
      ccRenderTypes();
      ccRenderSlotConfig();
      ccRenderFields(document.querySelector('.cc-field-search') ? document.querySelector('.cc-field-search').value : '');
      ccRenderSlots();
      ccRenderPreview();
    }

    /* 根据图表类型刷新字段配置区域的槽位行 */
    function ccRenderSlotConfig() {
      var slotCfg = CC_SLOT_CONFIG[ccState.type] || CC_SLOT_CONFIG.bar;
      ['x','y','y2','g'].forEach(function(k) {
        var row = document.querySelector('.cc-slot-row[data-slot="' + k + '"]');
        if (!row) return;
        var cfg = slotCfg[k];
        if (!cfg || cfg.visible === false) {
          row.style.display = 'none';
        } else {
          row.style.display = '';
          var labelEl = row.querySelector('.cc-slot-label');
          if (labelEl && cfg.label) labelEl.textContent = cfg.label;
        }
      });
    }
    function ccRenderTypes() { document.querySelectorAll('.cc-type-card').forEach(function(c) { c.classList.toggle('active', c.dataset.type === ccState.type); }); }
    function ccOnVersionTypeChange(vType) { ccState.versionType = vType; const vers = VERSIONS[vType] || []; const sel = document.getElementById('cc-version-select'); if (sel) { sel.innerHTML = vers.map(function(v) { return '<option value="' + v + '">' + v + '</option>'; }).join(''); } ccState.version = vers[0] || ''; ccUpdateMeta(); ccRenderPreview(); }
    function ccOnVersionChange(version) { ccState.version = version; ccUpdateMeta(); ccRenderPreview(); }
    function ccUpdateMeta() { const chip = document.querySelector('.cc-version-chip'); if (chip) chip.textContent = ccState.version; }
    function ccSwitchTab(tab) { ccActiveTab = tab; document.querySelectorAll('.cc-preview-tab').forEach(function(t) { t.classList.toggle('active', t.dataset.tab === tab); }); ccRenderPreview(); }

    function ccRenderPreview() {
      const area = document.getElementById('cc-preview-area');
      if (!area) return;
      const slots = ccState.slots || {};
      const hasConfig = (slots.x || []).length > 0 && (slots.y || []).length > 0;
      if (ccActiveTab === 'data') { ccRenderRawData(area); }
      else {
        area.innerHTML = '<div class="cc-chart-stage"><div class="cc-chart-canvas" id="cc-chart-canvas"></div></div>';
        const canvas = document.getElementById('cc-chart-canvas');
        if (!hasConfig) { canvas.innerHTML = '<div class="cc-preview-empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-placeholder)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 14l4-4 4 4 3-3 4 4"/></svg><div>请拖入字段配置图表后查看预览</div></div>'; return; }
        ccRenderChart(canvas);
      }
    }

    function ccRenderChart(container) {
      const slots = ccState.slots || {};
      const xField = (slots.x && slots.x[0] || {}).field || '区域';
      const yField = (slots.y && slots.y[0] || {}).field || '规模(万辆)';
      const y2Field = (slots.y2 && slots.y2[0] || {}).field || '';
      const groupField = (slots.g && slots.g[0] || {}).field || '';
      const rows = ccGetFilteredData();
      const aggregated = ccAggregateData(rows);
      var slotCfg = CC_SLOT_CONFIG[ccState.type] || CC_SLOT_CONFIG.bar;
      var xLabel = (slotCfg.x || {}).label || 'X 轴';
      var yLabel = (slotCfg.y || {}).label || 'Y 轴';
      var gLabel = (slotCfg.g || {}).label || '分组';
      const contextItems = ['<span class="cc-chart-context-item">' + xLabel + ' <strong>' + ccFieldName(xField) + '</strong></span>',
        '<span class="cc-chart-context-item">' + yLabel + ' <strong>' + ccFieldName(yField) + '</strong></span>'];
      if (y2Field) contextItems.push('<span class="cc-chart-context-item">Y2(折线) <strong>' + ccFieldName(y2Field) + '</strong></span>');
      if (slotCfg.g && slotCfg.g.visible !== false) contextItems.push('<span class="cc-chart-context-item">' + gLabel + ' <strong>' + ccFieldName(groupField || '无') + '</strong></span>');
      contextItems.push('<span class="cc-chart-context-item">版本 <strong>' + (ccState.version || '全部') + '</strong></span>');
      contextItems.push('<span class="cc-chart-context-meta">筛选后 ' + rows.length + ' 行</span>');
      const context = '<div class="cc-chart-context">' + contextItems.join('') + '</div>';
      if (!rows.length || !aggregated.labels.length || !aggregated.series.length) {
        container.innerHTML = context + '<div class="cc-preview-empty"><div>暂无符合筛选条件的数据</div></div>';
        return;
      }
      const chart = document.createElement('div');
      container.innerHTML = context;
      container.appendChild(chart);
      if (ccState.type === 'table') {
        renderTableChart(chart, aggregated.labels, aggregated.series, ccFieldName(xField));
        return;
      }
      chart.className = 'cc-chart-row';
      chart.innerHTML = '<div class="cc-chart-viz" id="cc-edit-viz"></div><div class="cc-chart-foot" id="cc-edit-viz-foot"></div>';
      const viz = document.getElementById('cc-edit-viz');
      if (ccState.type === 'bar') {
        renderGroupedBarChart(viz, aggregated.labels, aggregated.series);
      } else if (ccState.type === 'stackedBar' || ccState.type === 'percentBar') {
        var stackSeries = aggregated.series.map(function(s, i) { return { name: s.name, color: ['#2E5F95','#5AA0E6','#8FC0EF','#E68620','#10B981','#7C3AED'][i % 6], values: s.values.slice() }; });
        if (ccState.type === 'percentBar') {
          renderStackedSVG(viz, aggregated.labels, stackSeries);
        } else {
          renderStackedSVG(viz, aggregated.labels, stackSeries, false);
        }
      } else if (ccState.type === 'combo' || ccState.type === 'percentCombo' || ccState.type === 'areaCombo') {
        var barColors = ['#2E5F95', '#5AA0E6', '#8FC0EF', '#BFDCF6', '#E68620', '#D97706'];
        var barSeries = aggregated.series.map(function(s, i) {
          return { name: s.name, color: barColors[i % barColors.length], values: s.values };
        });
        var lineValues = aggregated.labels.map(function(label) {
          var matching = rows.filter(function(r) { return String(r[xField] == null ? '未设置' : r[xField]) === label; });
          if (!matching.length || !y2Field) return null;
          var sum = matching.reduce(function(acc, r) { return acc + Number(r[y2Field] || 0); }, 0);
          return +(sum / matching.length).toFixed(1);
        });
        if (ccState.type === 'percentCombo') {
          var percentSeries = barSeries.map(function(s) { return { name: s.name, color: s.color, values: s.values.map(function(v, i) { var total = barSeries.reduce(function(sum, item) { return sum + item.values[i]; }, 0); return total ? v / total : 0; }) }; });
          renderStackedCombo(viz, aggregated.labels, percentSeries, lineValues, y2Field || '折线', true);
        } else if (ccState.type === 'areaCombo') {
          renderAreaCombo(viz, aggregated.labels, barSeries, lineValues, y2Field || '折线');
        } else {
          renderComboChart(viz, aggregated.labels, barSeries, lineValues, y2Field || '折线');
        }
      } else if (ccState.type === 'line' || ccState.type === 'lineMarkers') {
        renderLineChart(viz, aggregated.labels, aggregated.series, ccState.type === 'lineMarkers');
      } else if (ccState.type === 'bubble') {
        renderBubbleChart(viz, aggregated.labels, aggregated.series);
      } else if (ccState.type === 'pie') {
        let labels = aggregated.labels;
        let values = aggregated.series[0].values;
        if (groupField) {
          labels = [];
          values = [];
          aggregated.series.forEach(function(series) {
            aggregated.labels.forEach(function(label, index) {
              labels.push(series.name + ' · ' + label);
              values.push(series.values[index]);
            });
          });
        }
        if (values.reduce(function(sum, value) { return sum + value; }, 0) <= 0) {
          chart.innerHTML = '<div class="cc-preview-empty"><div>暂无可展示的有效数据</div></div>';
        } else {
          renderPieChart(viz, labels, values, ['#2E5F95','#5AA0E6','#8FC0EF','#BFDCF6','#E68620','#F0A94D','#D6E8F5']);
        }
      }
    }

    function ccRenderRawData(container) {
      const rawData = ccGetFilteredData();
      const cols = Object.keys(ccGenerateRawData()[0] || {});
      const countEl = document.getElementById('cc-row-count');
      if (countEl) countEl.textContent = '· ' + rawData.length;
      const body = rawData.length ? rawData.map(function(row) { return '<tr>' + cols.map(function(c) { const v = row[c]; const isNum = typeof v === 'number'; return '<td class="' + (isNum ? 'num' : '') + '">' + v + '</td>'; }).join('') + '</tr>'; }).join('') : '<tr><td colspan="' + cols.length + '" style="text-align:center;padding:24px;color:var(--text-3);">暂无符合筛选条件的数据</td></tr>';
      container.innerHTML = '<table class="cc-raw-table"><thead><tr>' + cols.map(function(c) { const def = CC_FIELDS.find(function(f) { return f.key === c; }); const tag = def && def.type === 'dim' ? '<span style="font-size:8px;color:var(--primary);">D</span>' : def && def.type === 'metric' ? '<span style="font-size:8px;color:var(--brand-dark);">M</span>' : ''; return '<th>' + tag + ' ' + ((def && def.name) || c) + '</th>'; }).join('') + '</tr></thead><tbody>' + body + '</tbody></table><div style="text-align:center;padding:8px;font-size:11px;color:var(--text-3);">共 ' + rawData.length + ' 行 · 模拟数据</div>';
    }

    function ccSaveChart() {
      if (!ccState.name.trim()) {
        var y2Item = (ccState.slots.y2 || [])[0];
        if (ccState.type === 'combo' && y2Item) {
          ccState.name = ccFieldName((ccState.slots.x[0] || {}).field || 'X') + ' · ' + ccFieldName((ccState.slots.y[0] || {}).field || 'Y') + ' + ' + ccFieldName(y2Item.field || 'Y2') + ' (折柱图)';
        } else {
          ccState.name = ccFieldName((ccState.slots.x[0] || {}).field || 'X') + ' · ' + ccFieldName((ccState.slots.y[0] || {}).field || 'Y') + ' (' + CC_TYPE_NAMES[ccState.type] + ')';
        }
      }
      if (editingChartId) {
        const idx = customCharts.findIndex(function(c) { return c.id === editingChartId; });
        if (idx >= 0) { customCharts[idx].name = ccState.name; customCharts[idx].config = JSON.parse(JSON.stringify(ccState)); customCharts[idx].updatedAt = new Date().toLocaleString('zh-CN', { hour12: false }); }
      } else {
        customCharts.push({ id: 'cc_' + Date.now(), name: ccState.name, config: JSON.parse(JSON.stringify(ccState)), createdAt: new Date().toLocaleString('zh-CN', { hour12: false }), updatedAt: new Date().toLocaleString('zh-CN', { hour12: false }) });
      }
      ccCloseEditor();
      renderCustomCharts();
    }

    function renderCustomCharts() {
      const grid = document.getElementById('custom-charts-grid');
      const countEl = document.getElementById('custom-count');
      if (!grid) return;
      if (countEl) countEl.textContent = customCharts.length + ' 个图表';
      if (customCharts.length === 0) { grid.innerHTML = '<div class="custom-empty"><div class="custom-empty-ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></div><p>暂无自定义图表，点击「新建图表」创建</p></div>'; return; }
      const typeNames = CC_TYPE_NAMES;
      grid.innerHTML = customCharts.map(function(c) {
        const cfg = c.config || {};
        const previewId = 'cc-preview-' + c.id;
        return '<div class="custom-card"><div class="custom-card-head"><div class="custom-card-title">' + c.name + '<span class="custom-card-type">' + (typeNames[cfg.type] || '图表') + '</span></div><div class="custom-card-actions"><button onclick="openCustomChartModal(\'' + c.id + '\')" title="编辑"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2-2h7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button onclick="deleteCustomChart(\'' + c.id + '\')" title="删除"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div></div><div class="custom-card-body" id="' + previewId + '"></div><div class="custom-card-foot"><span>数据：' + (cfg.version || '') + '</span><span>' + c.updatedAt + '</span></div></div>';
      }).join('');
      const previousState = ccState;
      customCharts.forEach(function(c) {
        const cfg = c.config || {};
        const slots = cfg.slots || {};
        ccState = Object.assign({}, cfg, { slots: { x: slots.x || [], y: slots.y || [], y2: slots.y2 || [], g: slots.g || [] }, filters: cfg.filters || {}, version: cfg.version || '', versionType: cfg.versionType || '发布版' });
        const container = document.getElementById('cc-preview-' + c.id);
        if (!container) return;
        const rows = ccGetFilteredData();
        const aggregated = ccAggregateData(rows);
        if (!rows.length || !aggregated.labels.length || !aggregated.series.length) {
          container.innerHTML = '<div class="custom-chart-area"><div class="cc-preview-empty"><div>暂无符合筛选条件的数据</div></div></div>';
          return;
        }
        container.innerHTML = '<div class="custom-chart-area" id="' + c.id + '-area"></div>';
        var area = document.getElementById(c.id + '-area');
        if (cfg.type === 'table') {
          var xFieldTbl = (slots.x && slots.x[0] || {}).field || '区域';
          renderTableChart(area, aggregated.labels, aggregated.series, ccFieldName(xFieldTbl));
          return;
        }
        area.innerHTML = '<div class="cc-chart-row"><div class="cc-chart-viz" id="' + c.id + '-viz"></div><div class="cc-chart-foot" id="' + c.id + '-viz-foot"></div></div>';
        var viz = document.getElementById(c.id + '-viz');
        if (cfg.type === 'bar') {
          renderGroupedBarChart(viz, aggregated.labels, aggregated.series);
        } else if (cfg.type === 'stackedBar' || cfg.type === 'percentBar') {
          var stackSeriesCard = aggregated.series.map(function(s, i) { return { name: s.name, color: ['#2E5F95','#5AA0E6','#8FC0EF','#E68620','#10B981','#7C3AED'][i % 6], values: s.values.slice() }; });
          if (cfg.type === 'percentBar') {
            renderStackedSVG(viz, aggregated.labels, stackSeriesCard);
          } else {
            renderStackedSVG(viz, aggregated.labels, stackSeriesCard, false);
          }
        } else if (cfg.type === 'combo' || cfg.type === 'percentCombo' || cfg.type === 'areaCombo') {
          var barColors = ['#2E5F95', '#5AA0E6', '#8FC0EF', '#BFDCF6', '#E68620', '#D97706'];
          var barSeries = aggregated.series.map(function(s, i) { return { name: s.name, color: barColors[i % barColors.length], values: s.values }; });
          var xField2 = (slots.x && slots.x[0] || {}).field || '区域';
          var y2Field2 = (slots.y2 && slots.y2[0] || {}).field || '';
          var lineVals = aggregated.labels.map(function(label) {
            var m = rows.filter(function(r) { return String(r[xField2] == null ? '未设置' : r[xField2]) === label; });
            if (!m.length || !y2Field2) return null;
            var s = m.reduce(function(acc, r) { return acc + Number(r[y2Field2] || 0); }, 0);
            return +(s / m.length).toFixed(1);
          });
          if (cfg.type === 'percentCombo') {
            var percentSeriesCard = barSeries.map(function(s) { return { name: s.name, color: s.color, values: s.values.map(function(v, i) { var total = barSeries.reduce(function(sum, item) { return sum + item.values[i]; }, 0); return total ? v / total : 0; }) }; });
            renderStackedCombo(viz, aggregated.labels, percentSeriesCard, lineVals, y2Field2 || '折线', true);
          } else if (cfg.type === 'areaCombo') {
            renderAreaCombo(viz, aggregated.labels, barSeries, lineVals, y2Field2 || '折线');
          } else {
            renderComboChart(viz, aggregated.labels, barSeries, lineVals, y2Field2 || '折线');
          }
        } else if (cfg.type === 'line' || cfg.type === 'lineMarkers') {
          renderLineChart(viz, aggregated.labels, aggregated.series, cfg.type === 'lineMarkers');
        } else if (cfg.type === 'bubble') {
          renderBubbleChart(viz, aggregated.labels, aggregated.series);
        } else if (cfg.type === 'pie') {
          let labels = aggregated.labels;
          let values = aggregated.series[0].values;
          if (slots.g && slots.g.length) {
            labels = [];
            values = [];
            aggregated.series.forEach(function(series) { aggregated.labels.forEach(function(label, index) { labels.push(series.name + ' · ' + label); values.push(series.values[index]); }); });
          }
          if (values.reduce(function(sum, value) { return sum + value; }, 0) <= 0) area.innerHTML = '<div class="cc-preview-empty"><div>暂无可展示的有效数据</div></div>';
          else renderPieChart(viz, labels, values, ['#2E5F95','#E68620','#10B981','#7C3AED','#F59E0B','#6B7280','#EF4444','#3B82F6']);
        }
      });
      ccState = previousState;
    }

    function deleteCustomChart(id) {
      openConfirm({ title: '删除图表', desc: '确定要删除该自定义图表吗？删除后不可恢复。', okText: '删除', cancelText: '取消', onOk: function() { customCharts = customCharts.filter(function(c) { return c.id !== id; }); renderCustomCharts(); } });
    }

    /* ===== 页面渲染 ===== */
    function renderPage() {
      const filterSelect = (id, key, label) => {
        const opts = FILTER_OPTS[key];
        return `<select class="chart-filter" id="${id}" onchange="onFixedFilterChange('${id}','${key}')">
          ${opts.map(o => `<option value="${o}">${label}：${o}</option>`).join('')}
        </select>`;
      };

      const contentHtml = `
        <div class="page-title">数据看板</div>

        <div class="dash-tabsbar">
          <div class="dash-tabs" role="tablist">
            <button type="button" class="dash-tab active" id="dash-tab-fixed" role="tab" aria-selected="true" onclick="switchDashTab('fixed')">默认图表</button>
            <button type="button" class="dash-tab" id="dash-tab-custom" role="tab" aria-selected="false" onclick="switchDashTab('custom')">自定义图表</button>
          </div>
          <div class="dash-actions">
            <button class="btn-view-toggle" id="fixed-grid-view-toggle" onclick="toggleFixedGridView()" aria-label="切换为两列视图" title="切换为两列视图">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="9" height="9" rx="1.5"/><rect x="13" y="2" width="9" height="9" rx="1.5"/><rect x="2" y="13" width="9" height="9" rx="1.5"/><rect x="13" y="13" width="9" height="9" rx="1.5"/></svg>
            </button>
            <button class="btn-add-chart" id="custom-add-btn" onclick="openCustomChartModal()" style="display:none;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              新建图表
            </button>
          </div>
        </div>

        <div class="dash-tab-panel" id="dash-panel-fixed">
        <div class="fixed-grid">
          <!-- 1.1 规模 -->
          <div class="chart-card">
            <div class="chart-card-head">
              <div class="chart-card-title"><span class="chart-badge">1.1</span>规模</div>
              <div class="chart-card-filters">
                ${filterSelect('scale-version', 'IPV版本', '版本')}
                ${filterSelect('scale-market', '目标市场', '目标市场')}
                ${scaleYearFilterHtml()}
              </div>
            </div>
            <div class="chart-card-main">
              <div class="chart-card-body" id="chart-scale-body"></div>
              <div class="chart-card-foot" id="chart-scale-body-foot"></div>
            </div>
          </div>

          <!-- 1.2 规模自定义 -->
          <div class="chart-card">
            <div class="chart-card-head">
              <div class="chart-card-title"><span class="chart-badge">1.2</span>规模自定义</div>
              <div class="chart-card-filters">
                ${filterSelect('sc-region', '区域', '区域')}
                ${filterSelect('sc-version', 'IPV版本', '版本')}
                ${filterSelect('sc-country', '国家', '国家')}
                ${filterSelect('sc-body', '车身大类', '车身大类')}
                ${filterSelect('sc-regulation', '法规聚类', '法规')}
                ${filterSelect('sc-market', '目标市场', '目标市场')}
                ${filterSelect('sc-keycountry', '重点国家', '重点国家')}
              </div>
            </div>
            <div class="chart-card-main">
              <div class="chart-card-body" id="chart-scale-custom-body"></div>
              <div class="chart-card-foot" id="chart-scale-custom-body-foot"></div>
            </div>
          </div>

          <!-- 2.1 动力结构 -->
          <div class="chart-card">
            <div class="chart-card-head">
              <div class="chart-card-title"><span class="chart-badge bc2">2.1</span>动力结构</div>
              <div class="chart-card-filters">
                ${filterSelect('power-version', 'IPV版本', '版本')}
                ${filterSelect('power-body', '车身大类', '车身大类')}
                ${filterSelect('power-market', '目标市场', '目标市场')}
                ${filterSelect('power-year', '年份', '年份')}
              </div>
            </div>
            <div class="chart-card-main">
              <div class="chart-card-body" id="chart-power-body"></div>
              <div class="chart-card-foot" id="chart-power-body-foot"></div>
            </div>
          </div>

          <!-- 2.2 动力结构自定义 -->
          <div class="chart-card">
            <div class="chart-card-head">
              <div class="chart-card-title"><span class="chart-badge bc2">2.2</span>动力结构自定义</div>
              <div class="chart-card-filters">
                ${filterSelect('pc-region', '区域', '区域')}
                ${filterSelect('pc-version', 'IPV版本', '版本')}
                ${filterSelect('pc-country', '国家', '国家')}
                ${filterSelect('pc-body', '车身大类', '车身大类')}
                ${filterSelect('pc-regulation', '法规聚类', '法规')}
                ${filterSelect('pc-market', '目标市场', '目标市场')}
                ${filterSelect('pc-keycountry', '重点国家', '重点国家')}
              </div>
            </div>
            <div class="chart-card-main">
              <div class="chart-card-body" id="chart-power-custom-body"></div>
              <div class="chart-card-foot" id="chart-power-custom-body-foot"></div>
            </div>
          </div>
        </div>
        </div>

        <div class="dash-tab-panel" id="dash-panel-custom" hidden>
          <div style="font-size:12px;color:var(--text-3);margin-bottom:10px;">共 <span id="custom-count">0 个图表</span> · 支持自定义选择版本数据及图表类型</div>
          <div class="custom-grid" id="custom-charts-grid"></div>
        </div>
      `;
      initPage({ activeKey: '数据看板', contentHtml });
    }

    function onPageReady() {
      initFixedCharts();
      renderCustomCharts();
    }

    renderPage();
  </script>
</body>
</html>
