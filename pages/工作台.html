<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作台 - IPV数据管理平台</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    /* 工作台专属样式 */
    .workspace-wrap { display: flex; flex-direction: row; gap: 16px; height: calc(100vh - 60px - 24px); }
    /* 流程说明面板 */
    .flow-guide {
      width: 260px; flex-shrink: 0;
      background: #fff; border: 1px solid var(--border); border-radius: 10px;
      padding: 18px 16px; display: flex; flex-direction: column; gap: 16px;
      overflow-y: auto;
    }
    .flow-guide h4 { font-size: 13px; font-weight: 600; color: var(--text-1); margin: 0; display:flex;align-items:center;gap:6px; }
    .flow-guide h4::before { content:''; width:3px; height:14px; background:var(--primary); border-radius:2px; }
    .flow-stage { position: relative; padding-left: 38px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .flow-stage .stage-icon {
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; z-index: 2;
    }
    .flow-stage.s1 .stage-icon { background: #E6F4FF; color: var(--primary); }
    .flow-stage.s2 .stage-icon { background: #FFF7E6; color: #E68620; }
    .flow-stage.s3 .stage-icon { background: #F0F5FF; color: #4A6FC9; }
    .flow-stage.s4 .stage-icon { background: #F3EEFD; color: #7C3AED; }
    .flow-stage.s5 .stage-icon { background: #F6FFED; color: #52C41A; }
    .flow-stage.s6 .stage-icon { background: #E6FFFB; color: #0E7490; }
    .flow-stage.s7 .stage-icon { background: #FFF1F2; color: #E11D48; }
    .flow-stage .stage-title { font-size: 13px; font-weight: 600; color: var(--text-1); margin-bottom: 3px; }
    .flow-stage .stage-sub { font-size: 11px; color: var(--brand); font-weight:500; margin-bottom: 3px; }
    .flow-stage .stage-desc { font-size: 11px; color: var(--text-3); line-height: 1.5; }
    /* 连接线 */
    .flow-stage:not(:last-child)::after {
      content: ''; position: absolute; left: 13px; top: calc(50% + 14px);
      height: calc(100% - 28px + 22px);
      width: 1.5px; background: repeating-linear-gradient(to bottom, var(--border) 0 4px, transparent 4px 8px);
      z-index: 1;
    }
    .flow-current-tag {
      display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:600;
      color: var(--success); background: var(--success-soft); padding: 1px 6px; border-radius: 4px; margin-left: 4px; vertical-align: middle;
    }
    .chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; margin-bottom: 0; }
    .chat-area {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .msg-row { display: flex; gap: 12px; align-items: flex-start; }
    .msg-row.user { justify-content: flex-end; }
    .msg-avatar {
      width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--primary); color: #fff; font-size: 16px;
    }
    .msg-row.user .msg-avatar { background: var(--text-3); }
    .msg-bubble {
      max-width: 72%; padding: 12px 16px; border-radius: 10px;
      background: #fff; border: 1px solid var(--border);
      font-size: 13px; line-height: 1.6; color: var(--text-1);
    }
    .msg-row.user .msg-bubble { background: var(--primary); color: #fff; border-color: var(--primary); }
    .msg-bubble .msg-title { font-weight: 600; margin-bottom: 8px; }
    .msg-bubble .msg-desc { color: var(--text-3); font-size: 12px; margin-top: 4px; }
    .msg-row.user .msg-bubble .msg-desc { color: rgba(255,255,255,.8); }

    /* 选项按钮组 */
    .option-group { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .option-btn {
      padding: 8px 18px; border: 1px solid var(--primary); background: #fff;
      color: var(--primary); border-radius: 6px; font-size: 13px; cursor: pointer;
      transition: all .15s;
    }
    .option-btn:hover { background: var(--primary); color: #fff; }

    /* Excel 附件卡片（对话内） */
    .chat-file-card {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: var(--primary-lighter); border: 1px solid var(--primary-border);
      border-radius: 8px; margin-top: 10px;
    }
    .chat-file-card .ficon { color: var(--primary); flex-shrink: 0; }
    .chat-file-card .finfo { flex: 1; min-width: 0; }
    .chat-file-card .fname { font-size: 12px; font-weight: 600; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-file-card .fmeta { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .chat-file-card .fbtn { font-size: 12px; color: var(--primary); cursor: pointer; flex-shrink: 0; }

    /* 维度选择卡片 */
    .dim-card {
      background: #fff; border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; margin-top: 12px;
    }
    .dim-list { display: flex; flex-direction: column; gap: 6px; }
    .dim-item { display: flex; flex-direction: row; align-items: center; gap: 10px; }
    .dim-item label { flex: 1; font-size: 12px; color: var(--text-1); font-weight: 500; }
    .dim-item select {
      border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
      font-size: 13px; background: #fff; color: var(--text-1); outline: none;
      height: 34px; width: 80px; flex-shrink: 0;
    }
    .dim-item select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-lighter); }
    .dim-upload {
      margin-top: 12px; padding: 12px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      color: var(--primary); font-size: 12px; font-weight: 500;
      background: var(--primary-lighter); border: 1px dashed var(--primary-border);
    }
    .dim-upload:hover { background: var(--primary-border); }
    .dim-upload input[type="file"] { display: none; }
    .dim-file-info { margin-top: 6px; }
    .dim-file-name {
      font-size: 12px; color: var(--success); background: var(--success-soft);
      border-radius: 4px; padding: 4px 8px; display: inline-flex; align-items: center; gap: 4px;
    }
    .dim-actions { display: flex; gap: 10px; margin-top: 14px; justify-content: flex-end; }

    /* 输入区 */
    .input-area {
      border-top: 1px solid var(--border); padding: 14px 0;
      display: flex; gap: 10px; align-items: stretch;
    }
    .input-box {
      flex: 1; background: #fff; border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 12px; display: flex; align-items: center; gap: 10px;
      min-height: 48px;
      transition: border-color .15s;
    }
    .input-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-lighter); }
    .input-box textarea {
      flex: 1; border: none; outline: none; resize: none; font-size: 13px;
      line-height: 1.5; max-height: 80px; font-family: inherit; color: var(--text-1);
      background: transparent;
    }
    .input-box textarea::placeholder { color: var(--text-3); }
    .send-btn {
      width: 48px; height: 48px; border-radius: 10px; border: none;
      background: var(--primary); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: background .15s;
    }
    .send-btn:hover { background: var(--primary-dark); }

    /* 保存为过程版弹窗版本号选项卡宽度适配 */
    .modal .version-picker { flex-wrap: wrap; }
  </style>
</head>
<body>
  <script src="../assets/js/common.js"></script>
  <script>
    // 版本号工具函数（与审批中心一致）
    const YEARS = ['2026', '2025', '2024'];
    const HALF = [
      { value: 'A', label: 'A · 上半年' },
      { value: 'B', label: 'B · 下半年' },
    ];
    const MMDD_OPTIONS = (() => {
      const arr = [];
      for (let m = 1; m <= 12; m++) for (let d = 1; d <= 31; d++) {
        const mm = String(m).padStart(2, '0'), dd = String(d).padStart(2, '0');
        arr.push({ value: mm + dd, label: `${mm}/${dd}` });
      }
      return arr;
    })();
    function composeVersion(year, half, type, date) { return `${year}-${half}-IPV【${type}_${date}】`; }

    // 模版调整可选维度组合（可多选置为「是」，需至少选择一种）
    const ADJUST_COMBOS = [
      '总量',
      '动力结构',
      '品类_动力',
      '品类结构',
      '品类_品种结构',
      '品类_车格细分',
      '品类_品种_价格段结构',
      '品类_品种_价格段_车格',
      '品类_品种_价格段_车格_动力',
    ];

    // 消息列表
    let messages = [];
    // 模版调整卡片自增编号（进入流程时用于生成卡片内控件的唯一 id）
    let dimSeq = 0;

    function init() {
      const contentHtml = `
        <div class="page-title">工作台</div>
        <div class="workspace-wrap" style="height: calc(100vh - 130px);">
          <div class="flow-guide">
            <h4>预测数据全流程</h4>
            <div class="flow-stage s1">
              <div class="stage-icon">1</div>
              <div class="stage-title">IPV结果表与因子表生成与确认</div>
              <div class="stage-sub">系统自动生成 · 结果确认</div>
              <div class="stage-desc">确认 IPV 结果表与因子表已生成且口径一致，作为后续预测与调整的数据基础。</div>
            </div>
            <div class="flow-stage s2">
              <div class="stage-icon">2</div>
              <div class="stage-title">IPV人工预测因子补充</div>
              <div class="stage-sub">人工补充 · 修正因子</div>
              <div class="stage-desc">补充或修正影响 IPV 预测的人工因子，为预测调整提供输入。</div>
            </div>
            <div class="flow-stage s3">
              <div class="stage-icon">3</div>
              <div class="stage-title">初版数据-IPV预测调整</div>
              <div class="stage-sub">自动生成 · 预测微调</div>
              <div class="stage-desc">输入「初版数据」获取基线，结合补充因子完成 IPV 预测调整。</div>
            </div>
            <div class="flow-stage s4">
              <div class="stage-icon">4</div>
              <div class="stage-title">模板 / 模型调整 <span class="flow-current-tag" id="current-stage-tag">当前</span></div>
              <div class="stage-sub">人工调整 · 单次确认</div>
              <div class="stage-desc">选择一种维度组合并上传待调整数据文件，系统按所选维度完成一次调整并返回结果。</div>
            </div>
            <div class="flow-stage s5">
              <div class="stage-icon">5</div>
              <div class="stage-title">过程版数据生成</div>
              <div class="stage-sub">保存为 Draft · 提交审批</div>
              <div class="stage-desc">调整满意后保存为过程版，生成 Draft 版本号并提交审批。</div>
            </div>
            <div class="flow-stage s6">
              <div class="stage-icon">6</div>
              <div class="stage-title">数据审批</div>
              <div class="stage-sub">审批中心流转</div>
              <div class="stage-desc">提交后进入「审批中」，通过则变为「待发布」，驳回可重发。</div>
            </div>
            <div class="flow-stage s7">
              <div class="stage-icon">7</div>
              <div class="stage-title">数据发布</div>
              <div class="stage-sub">正式对外 · Publish / Update</div>
              <div class="stage-desc">同半年度首次发布为 Publish，再次发布为 Update。</div>
            </div>
          </div>
          <div class="chat-col card">
            <div class="card-body" style="flex:1;display:flex;flex-direction:column;height:100%;">
            <div class="chat-area" id="chat-area">
              <div class="msg-row">
                <div class="msg-avatar">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
                </div>
                <div class="msg-bubble">
                  <div class="msg-title">你好，我是 IPV 预测数据助手</div>
                  <div>我可以帮你生成和调整 IPV 预测数据。请输入指令开始，例如「初版数据」。</div>
                </div>
              </div>
            </div>
            <div class="input-area">
              <div class="input-box">
                <textarea id="ws-input" rows="1" placeholder="输入指令，如「初版数据」，按 Enter 发送..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
              </div>
              <button class="send-btn" onclick="sendMessage()" title="发送">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
            </div>
          </div>
        </div>
      `;
      initPage({ activeKey: '工作台', contentHtml });
      messages = [];
    }

    function appendMessage(role, html) {
      const area = document.getElementById('chat-area');
      const row = document.createElement('div');
      row.className = 'msg-row ' + role;
      const avatar = role === 'user' ? 'U' : 'AI';
      row.innerHTML = `
        ${role === 'user' ? '' : `<div class="msg-avatar">${avatar}</div>`}
        <div class="msg-bubble">${html}</div>
        ${role === 'user' ? `<div class="msg-avatar">${avatar}</div>` : ''}
      `;
      area.appendChild(row);
      area.scrollTop = area.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('ws-input');
      const text = input.value.trim();
      if (!text) return;
      appendMessage('user', `<div>${escapeHtml(text)}</div>`);
      input.value = '';
      handleUserInput(text);
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function handleUserInput(text) {
      if (text.includes('初版数据')) {
        setTimeout(() => replyInitialData(), 500);
      } else {
        setTimeout(() => {
          appendMessage('ai', `我暂时只支持「初版数据」指令，请重新输入。`);
        }, 500);
      }
    }

    // 步骤2：返回初版数据 Excel + 三个选项
    function replyInitialData() {
      const html = `
        <div class="msg-title">已为你生成最新版「初版数据」</div>
        <div>请下载查看，完成后选择后续操作：</div>
        <div class="chat-file-card">
          <div class="ficon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
          <div class="finfo"><div class="fname">IPV初版数据_20260907.xlsx</div><div class="fmeta">256 KB · 初版预测数据</div></div>
          <span class="fbtn" onclick="alert('开始下载：IPV初版数据_20260907.xlsx')">下载</span>
        </div>
        <div class="option-group">
          <button class="option-btn" onclick="chooseTemplate()">模版调整</button>
          <button class="option-btn" onclick="chooseModel()">模型调整</button>
          <button class="option-btn" onclick="chooseManualUpload()">人工上传</button>
        </div>
      `;
      appendMessage('ai', html);
    }

    function chooseTemplate() {
      appendMessage('user', '<div>模版调整</div>');
      setTimeout(() => showDimensionPicker(), 400);
    }
    function chooseModel() {
      appendMessage('user', '<div>模型调整</div>');
      setTimeout(() => {
        const html = `
          <div class="msg-title">模型调整</div>
          <div>通过调整预测模型参数来重新生成数据，适合对预测逻辑本身进行优化的场景。</div>
          <div class="option-group">
            <button class="option-btn" onclick="alert('模型参数配置功能开发中，敬请期待')">配置模型参数</button>
            <button class="option-btn" onclick="chooseTemplate()">改用模版调整</button>
          </div>
        `;
        appendMessage('ai', html);
      }, 400);
    }
    function chooseManualUpload() {
      appendMessage('user', '<div>人工上传</div>');
      setTimeout(() => {
        const html = `
          <div class="msg-title">人工上传</div>
          <div>直接上传你已调整好的过程版数据文件，无需走模版调整流程。</div>
          <div style="margin-top:6px;color:var(--text-3);">请选择 .xlsx / .xls / .csv 文件，在上传控件中完成上传。</div>
        `;
        appendMessage('ai', html);
      }, 400);
    }

    // 步骤3：维度组合 + 文件上传（本轮仅调整一次）
    function showDimensionPicker() {
      dimSeq++;
      const sid = dimSeq;
      const html = `
        <div class="msg-title">请选择调整维度组合，并上传需要调整的数据文件</div>
        <div class="dim-card">
          <div class="dim-list">
            ${ADJUST_COMBOS.map((name, i) => `
              <div class="dim-item">
                <label>${name}</label>
                <select id="dim-${sid}-${i}">
                  <option value="0">否</option>
                  <option value="1">是</option>
                </select>
              </div>
            `).join('')}
          </div>
          <label class="dim-upload" for="dim-file-${sid}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>点击上传需要调整的 Excel 文件</span>
            <input id="dim-file-${sid}" type="file" accept=".xlsx,.xls,.csv" onchange="onDimFile(${sid})">
          </label>
          <div class="dim-file-info" id="dim-file-info-${sid}"></div>
          <div class="dim-actions">
            <button class="option-btn" onclick="cancelDimension()">取消</button>
            <button class="option-btn" style="background:var(--primary);color:#fff;" onclick="confirmDimension(${sid})">确认调整</button>
          </div>
        </div>
      `;
      appendMessage('ai', html);
    }

    function cancelDimension() {
      appendMessage('user', '<div>取消</div>');
    }

    function onDimFile(sid) {
      const input = document.getElementById('dim-file-' + sid);
      const box = document.getElementById('dim-file-info-' + sid);
      if (!input || !box) return;
      const f = input.files && input.files[0];
      box.innerHTML = f ? `<div class="dim-file-name">✓ ${escapeHtml(f.name)}</div>` : '';
    }

    function confirmDimension(sid) {
      const chosen = ADJUST_COMBOS.filter((_, i) => {
        const el = document.getElementById('dim-' + sid + '-' + i);
        return el && el.value === '1';
      });
      if (!chosen.length) {
        alert('请至少选择一种维度组合并置为「是」。');
        return;
      }
      const input = document.getElementById('dim-file-' + sid);
      if (!input || !input.files || !input.files.length) {
        alert('请先上传需要调整的 Excel 文件。');
        return;
      }
      const comboLabel = chosen.join(' + ');
      const fileName = input.files[0].name;
      appendMessage('user', `
        <div>已选择：${comboLabel}</div>
        <div class="chat-file-card" style="margin-top:6px;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);">
          <div class="ficon" style="color:#fff;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
          <div class="finfo"><div class="fname" style="color:#fff;">${escapeHtml(fileName)}</div><div class="fmeta" style="color:rgba(255,255,255,.8);">待调整文件 · 已上传</div></div>
          <span class="fbtn" style="color:#fff;">✓</span>
        </div>
      `);
      setTimeout(() => replyAdjusted(chosen), 500);
    }

    // 步骤4：返回调整后的 Excel，流程结束（本轮仅调整一次）
    function replyAdjusted(combos) {
      const comboLabel = combos.join(' + ');
      const html = `
        <div class="msg-title">已按「${comboLabel}」完成数据调整</div>
        <div>已生成调整后的预测数据文件，请下载：</div>
        <div class="chat-file-card">
          <div class="ficon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
          <div class="finfo"><div class="fname">IPV调整结果_${comboLabel}_20260907.xlsx</div><div class="fmeta">256 KB · 调整后数据</div></div>
          <span class="fbtn" onclick="alert('开始下载：IPV调整结果_${comboLabel}_20260907.xlsx')">下载</span>
        </div>
        <div class="msg-desc">本次模版调整流程结束，可将调整结果保存为过程版数据并提交审批。</div>
        <div class="option-group">
          <button class="option-btn" style="background:var(--primary);color:#fff;border-color:var(--primary);" onclick="saveAsDraft()">保存为过程版数据</button>
        </div>
      `;
      appendMessage('ai', html);
    }

    // 步骤5：保存为过程版数据
    function saveAsDraft() {
      appendMessage('user', '<div>保存为过程版数据</div>');
      setTimeout(() => openDraftNaming(), 400);
    }

    function openDraftNaming() {
      const today = new Date();
      const defaultMMDD = String(today.getMonth() + 1).padStart(2, '0') + String(today.getDate()).padStart(2, '0');
      const html = `
        <div class="modal-mask">
          <div class="modal">
            <div class="modal-header">
              <div class="modal-title">保存为过程版数据</div>
              <button class="close" data-close>&times;</button>
            </div>
            <div class="modal-body">
              <div class="form-section-title">过程版版本号</div>
              <div class="form-item full">
                <span class="form-label">版本号 <span style="color:var(--danger);">*</span></span>
                <div class="version-picker">
                  <select id="draft-year">
                    ${YEARS.map(y => `<option value="${y}" ${y==='2026'?'selected':''}>${y}</option>`).join('')}
                  </select>
                  <span class="vp-sep">-</span>
                  <select id="draft-half">
                    ${HALF.map(h => `<option value="${h.value}" ${h.value==='A'?'selected':''}>${h.label}</option>`).join('')}
                  </select>
                  <span class="vp-sep">-IPV【</span>
                  <select id="draft-type"><option value="Draft" selected>Draft · 过程版</option></select>
                  <span class="vp-sep">_</span>
                  <select id="draft-date">
                    ${MMDD_OPTIONS.map(o => `<option value="${o.value}" ${o.value===defaultMMDD?'selected':''}>${o.label}</option>`).join('')}
                  </select>
                  <span class="vp-sep">】</span>
                </div>
                <div style="font-size:11px;color:var(--text-3);margin-top:6px;">保存后将提交至「审批中心」，审批通过后方可发布。</div>
              </div>
            </div>
            <div class="modal-footer">
              <button data-close>取 消</button>
              <button class="primary" onclick="doSaveDraft()">确认保存</button>
            </div>
          </div>
        </div>
      `;
      openModal(html);
    }

    function doSaveDraft() {
      const year = document.getElementById('draft-year').value;
      const half = document.getElementById('draft-half').value;
      const type = document.getElementById('draft-type').value;
      const date = document.getElementById('draft-date').value;
      const version = composeVersion(year, half, type, date);

      openConfirm({
        title: '确认保存？',
        desc: `保存为过程版数据：${version}，将提交至审批中心。`,
        okText: '确认保存', okType: 'primary',
        onOk: () => {
          closeModal();
          // 更新流程面板"当前"标记到第5步（过程版数据生成）
          const tag = document.getElementById('current-stage-tag');
          if (tag) {
            tag.remove();
            const stage5 = document.querySelectorAll('.flow-stage')[4];
            if (stage5) {
              const titleEl = stage5.querySelector('.stage-title');
              if (titleEl) titleEl.insertAdjacentHTML('beforeend', ' <span class="flow-current-tag" id="current-stage-tag">当前</span>');
            }
          }
          const html = `
            <div class="msg-title">已保存为过程版数据</div>
            <div>版本号：<b>${version}</b></div>
            <div style="margin-top:6px;color:var(--text-3);">已提交至审批中心，状态为「审批中」。审批通过后可在「待发布」中执行发布。</div>
            <div class="option-group">
              <button class="option-btn" style="background:var(--primary);color:#fff;border-color:var(--primary);" onclick="location.href='审批中心.html'">前往审批中心</button>
            </div>
          `;
          appendMessage('ai', html);
        },
      });
    }

    function onPageReady() {}
    init();
  </script>
</body>
</html>
